        doc_type: regulation
        format: pdf
        notes: Found via LSO research archive copy dated 2004; verify current version against WYDOT site directly before citing.
      - title: M-54 License Packet (Utility Construction Authorization)
        url: https://www.dot.state.wy.us/files/live/sites/wydot/files/shared/Highway_Development/Utilities/M-54_License_Packet%20_Apr%202018.pdf
        doc_type: application_packet
        format: pdf
