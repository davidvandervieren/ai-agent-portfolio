        notes: "Chapter 8 exact regulation text URL not confirmed this pass; SHWD administers commercial ponds/pits for O&G fluid disposal per search summary. Cross-reference BLM IM-WY-2012-007 (Management of O&G E&P Pits) for federal-land overlap context only, not a WY state doc."
