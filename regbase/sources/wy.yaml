  # =========================================================================
  # STATE LEVEL
  # =========================================================================

  - id: wy-wogcc-rules
    jurisdiction_level: state
    state: WY
    name: Wyoming Oil and Gas Conservation Commission - Rules and Regulations
    agency: Wyoming Oil and Gas Conservation Commission (WOGCC)
    authority_type: [oil_gas_conservation, underground_injection, waste, reclamation, spill_reporting]
    applies_to: [swd_well, well_pad, tank_battery, midstream_pipeline, produced_water_line, compressor_station, gas_processing_plant]
    code_platform: state_register
    landing_url: https://wogcc.wyo.gov/rules
    documents:
      - title: WOGCC Rules (Chapters 1-13, incl. Ch.3 Operations, Ch.4 Injection/Disposal, Ch.11 Flaring/Venting)
        url: https://wogcc.wyo.gov/rules
        doc_type: regulation
        format: html
        citation_root: WOGCC Rules & Regs, Ch. 1-13
        notes: "Landing page for current WOGCC rule chapters. Ch.4 is WY's Class II UIC primacy program (EPA-delegated). Ch.11 covers flaring/venting. Individual chapter PDFs must be pulled from this page per-chapter; not individually verified this pass."
      - title: WOGCC home / hearings and orders
        url: https://wogcc.wyo.gov/home
        doc_type: guidance
        format: html
        notes: Commission hearings held monthly (2nd Tuesday); orders and dockets linked from here.
    permits:
      - name: Application for Permit to Drill (APD)
        form_id: Form 3
        trigger: Drilling any new well (incl. SWD/injection well prior to conversion)
        decision_body: WOGCC Supervisor / Commission
        public_hearing: false
      - name: Sundry Notice
        form_id: Form 4
        trigger: Subsequent well operations changes (workover, plugging, etc.)
      - name: Organization Report
        form_id: Form 1
        trigger: Operating in Wyoming as an oil/gas operator - registration prerequisite
      - name: Application for Permit to Inject (Class II UIC / SWD)
        form_id: Form 15
        trigger: SWD/injection well permitting under WOGCC Ch.4
        decision_body: WOGCC Supervisor / Commission
        public_hearing: true
        typical_timeline_days: unverified
      - name: Operator Blanket / Idle Well / Pit / Split Estate / Commercial Class II Disposal Bonds
        trigger: Bonding required by mineral ownership type prior to operations
        decision_body: WOGCC
    contacts:
      - role: WOGCC main office
        office: Wyoming Oil and Gas Conservation Commission
        phone: (307) 234-7147
        url: https://wogcc.wyo.gov/
    confidence: probable
    last_reviewed: "2026-09-04"

  - id: wy-wogcc-eforms
    jurisdiction_level: state
    state: WY
    name: Wyoming eWOGCC / Electronic Forms System
    agency: Wyoming Oil and Gas Conservation Commission (WOGCC)
    authority_type: [oil_gas_conservation, underground_injection]
    applies_to: [swd_well, well_pad, tank_battery, gas_processing_plant]
    code_platform: self_hosted
    landing_url: https://wogcc.wyo.gov/electronic-forms
    documents:
      - title: WOGCC Electronic Forms (Forms 1, 3, 4, 7, 8, 15, 16, etc.)
        url: https://wogcc.wyo.gov/electronic-forms
        doc_type: form
        format: html
        notes: Landing/index page for all eForms; individual form numbers not each independently verified this pass.
      - title: WOGCC Application and Order Templates
        url: https://wogcc.wyo.gov/hearings/application-and-order-templates
        doc_type: application_packet
        format: html
      - title: WOGCC New Operator Information
        url: https://wogcc.wyo.gov/public-resources/operators-resources/new-operator-information
        doc_type: guidance
        format: html
    confidence: probable
    last_reviewed: "2026-09-04"

  - id: wy-deq-aqd
    jurisdiction_level: state
    state: WY
    name: Wyoming DEQ Air Quality Division - Permitting (WAQSR Ch.6, Ch.8)
    agency: Wyoming Department of Environmental Quality, Air Quality Division (AQD)
    authority_type: [air_quality]
    applies_to: [well_pad, tank_battery, compressor_station, gas_processing_plant, midstream_pipeline]
    code_platform: state_register
    landing_url: https://deq.wyoming.gov/aqd/new-source-review/
    documents:
      - title: New Source Review (WAQSR Chapter 6, Sections 2/3/4) landing page
        url: https://deq.wyoming.gov/aqd/new-source-review/
        doc_type: guidance
        format: html
        citation_root: WAQSR Ch. 6
        notes: "Ch.6 Sec.2 = construction/modification permit (standard); Ch.6 Sec.3 referenced re: operating permits; Ch.6 Sec.4 = PSD preconstruction review (major source). Statewide Oil & Gas Production Facilities Permitting Guidance and Presumptive BACT doc are linked from AQD site but exact guidance-doc URL not independently confirmed this pass."
      - title: Title V Permitting (major sources incl. large gas processing plants)
        url: https://deq.wyoming.gov/aqd/title-v-permitting/
        doc_type: guidance
        format: html
      - title: Oil and Gas Methane Rule
        url: https://deq.wyoming.gov/aqd/oil-and-gas-methane-rule/
        doc_type: regulation
        format: html
        applies_to_note: LDAR/methane requirements for O&G production/compression facilities
    permits:
      - name: Chapter 6 Section 2 Construction/Modification Permit
        trigger: New facility/source or modification with potential air contaminant increase (compressors, tanks, dehydrators, flares)
        decision_body: DEQ AQD
        notes: No de minimis exemption in Ch.6; Presumptive BACT allows some O&G production sites to start up before permit issuance if control requirements are met (per WS 35-11-801(e)).
      - name: Chapter 6 Section 4 PSD/Minor Source Preconstruction Review
        trigger: Major source PSD applicability
    confidence: probable
    last_reviewed: "2026-09-04"

  - id: wy-deq-wqd
    jurisdiction_level: state
    state: WY
    name: Wyoming DEQ Water Quality Division - WYPDES / Produced Water / Groundwater Pollution Control
    agency: Wyoming Department of Environmental Quality, Water Quality Division (WQD)
    authority_type: [water_quality, underground_injection, spill_reporting]
    applies_to: [produced_water_line, swd_well, well_pad, tank_battery]
    code_platform: state_register
    landing_url: https://deq.wyoming.gov/water-quality/
    documents:
      - title: Produced Water Disposal & Treatment
        url: https://deq.wyoming.gov/water-quality/water-wastewater/permitting/produced-water-disposal-treatment/
        doc_type: guidance
        format: html
        notes: Surface discharge of produced water regulated under WYPDES; groundwater discharge under Groundwater Pollution Control (GPC) Program (Class V UIC-adjacent).
      - title: Water Quality Rules and Regulations, Chapter 11 (incl. industrial waste)
        url: http://eqc.state.wy.us/orders/Water%20Closed%20Cases/11-3101%20WQD%20Chapt%203,5,11,12,16,20,21,23%20w-NEW%20Chapt.%2025%20and%2026/Chapter%2011%20New%20Clean.pdf
        doc_type: regulation
        format: pdf
        citation_root: Wyoming Water Quality Rules and Regs, Ch. 11
        notes: URL found via search of EQC closed-cases archive; may not be the current consolidated chapter text - verify against Secretary of State rules.wyo.gov before citing.
      - title: WYPDES Discharge Permitting
        url: https://deq.wyoming.gov/water-quality/wypdes/discharge-permitting/
        doc_type: guidance
        format: html
        citation_root: WY Water Quality Rules Ch. 3 (WYPDES)
      - title: Other Permits (small wastewater / Class V UIC-adjacent)
        url: https://deq.wyoming.gov/water-quality/water-wastewater/permitting/other-permits/
        doc_type: guidance
        format: html
    confidence: probable
    last_reviewed: "2026-09-04"

  - id: wy-deq-lqd
    jurisdiction_level: state
    state: WY
    name: Wyoming DEQ Land Quality Division
