        url: https://primis.phmsa.dot.gov/comm/statepages/wyoming.htm
        doc_type: guidance
        format: html
        notes: Direct Wyoming811.com landing URL was not independently confirmed in search results this pass; this PHMSA state page and the Wyoming Pipeline Association page reference it. Verify wyoming811.com directly before relying on it.
      - title: Wyoming Pipeline Association (WyPA)
        url: https://wypa.pipelineawareness.org/
        doc_type: guidance
        format: html
    confidence: unverified
    last_reviewed: "2026-09-04"

  - id: wy-pipeline-corridor-initiative
    jurisdiction_level: state
    state: WY
    name: Wyoming Pipeline Corridor Initiative (WPCI) / Wyoming Energy Authority (formerly Pipeline Authority)
    agency: Wyoming Energy Authority (WEA) - successor to the Wyoming Pipeline Authority
    authority_type: [roads_row, land_use_zoning]
    applies_to: [midstream_pipeline]
    code_platform: unknown
    landing_url: https://www.eoriwyoming.org/co2-initiative/wyoming-pipeline-corridor-initiative
    documents:
      - title: Wyoming Pipeline Corridor Initiative overview
        url: https://www.eoriwyoming.org/co2-initiative/wyoming-pipeline-corridor-initiative
        doc_type: guidance
        format: html
        notes: "WPCI designates federal-land corridors (primarily for CO2 EOR pipelines) to shorten siting timelines. NOTE: the Wyoming Pipeline Authority has been renamed/absorbed into the Wyoming Energy Authority (WEA) - confirm WEA's own current site (energyauthority.wyo.gov or similar) directly; not independently located/verified this pass."
      - title: WPCI Record of Decision map
        url: https://www.eoriwyoming.org/downloads/WPCI_ROD_map.pdf
        doc_type: map
        format: pdf
    confidence: unverified
    last_reviewed: "2026-09-04"

