  - id: wy-psc
    jurisdiction_level: state
    state: WY
    name: Wyoming Public Service Commission - Intrastate Gas Pipeline Safety
    agency: Wyoming Public Service Commission (PSC)
    authority_type: [pipeline_safety]
    applies_to: [midstream_pipeline, gas_processing_plant]
    code_platform: state_register
    landing_url: https://psc.wyo.gov/pipeline
    documents:
      - title: PSC Pipeline Safety program
        url: https://psc.wyo.gov/pipeline
        doc_type: guidance
        format: html
        notes: PSC has PHMSA-delegated safety jurisdiction over intrastate gas transmission, gas distribution, LPG distribution, and regulated gas gathering systems in WY; NOT interstate gas or hazardous liquids pipelines (those are PHMSA-direct). Regulates ~20 intrastate pipeline companies.
      - title: PSC Gas program (CPCN)
        url: https://psc.wyo.gov/gas
        doc_type: guidance
        format: html
        citation_root: Wyoming Statutes Title 37, Ch. 2
    permits:
      - name: Certificate of Public Convenience and Necessity (CPCN)
        trigger: Intrastate gas transmission line or high-pressure distribution line (>125 psig MAOP)
        decision_body: Wyoming Public Service Commission
    confidence: probable
    last_reviewed: "2026-09-04"

  - id: wy-wgfd-sagegrouse
    jurisdiction_level: state
    state: WY
    name: Wyoming Game & Fish Department - Sage-Grouse Core Area / Big Game Migration Corridor Recommendations
    agency: Wyoming Game and Fish Department (WGFD); policy set by Governor's Executive Order
    authority_type: [wildlife, endangered_species]
    applies_to: [well_pad, midstream_pipeline, access_road, compressor_station]
    code_platform: self_hosted
    landing_url: https://wgfd.wyo.gov/wyoming-wildlife/sage-grouse-management/sage-grouse-executive-order
    documents:
      - title: Sage-Grouse Executive Order (Core Area policy)
        url: https://wgfd.wyo.gov/wyoming-wildlife/sage-grouse-management/sage-grouse-executive-order
        doc_type: policy
        format: html
        notes: "Current policy framework is the Governor's (Gordon) Executive Order on Greater Sage-Grouse plus a separate EO on Mule Deer/Antelope Migration Corridors. Core Area standard: no more than 5% surface disturbance within a designated Core Area. Executive Order is state policy, not a WOGCC/DEQ rule - it is implemented mainly through BLM/state land leasing stipulations and WOGCC permit conditions, not a standalone permit."
      - title: Recommendations for Development of Oil and Gas Resources
        url: https://wgfd.wyo.gov/media/2358/download
        doc_type: guidance
        format: pdf
        citation_root: WGFD O&G Development Recommendations
    confidence: probable
    last_reviewed: "2026-09-04"

  - id: wy-shpo
    jurisdiction_level: state
    state: WY
    name: Wyoming State Historic Preservation Office - Section 106 Review
    agency: Wyoming State Historic Preservation Office (SHPO) / Wyoming Office of State Parks and Cultural Resources
    authority_type: [cultural_historic]
    applies_to: [midstream_pipeline, well_pad, access_road, compressor_station, gas_processing_plant]
    code_platform: self_hosted
