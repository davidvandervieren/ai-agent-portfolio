        notes: Triggered for projects on federal land, using federal funds, or requiring federal permitting; also implements WY Antiquities Act of 1935 and WY Environmental Quality Act of 1973.
      - title: E-106 Submission portal (WyoTrack)
        url: https://shpo.uwyo.edu/PublicE106
        doc_type: application_packet
        format: html
      - title: Cultural Records program
        url: https://wyoshpo.wyo.gov/index.php/programs/cultural-records
        doc_type: guidance
        format: html
    contacts:
      - role: SHPO main office
        phone: "307-777-7697"
        office: 2301 Central Avenue, Cheyenne, WY 82002
    confidence: probable
    last_reviewed: "2026-09-04"

  - id: wy-deq-industrial-siting
    jurisdiction_level: state
    state: WY
    name: Wyoming Industrial Siting Council - Industrial Development Information and Siting Act
    agency: Wyoming DEQ Industrial Siting Division / Industrial Siting Council
    authority_type: [land_use_zoning, air_quality, water_quality]
    applies_to: [gas_processing_plant, compressor_station, midstream_pipeline]
    code_platform: state_register
    landing_url: https://deq.wyoming.gov/industrial-siting-2/
    documents:
      - title: Industrial Siting - Permitting
        url: https://deq.wyoming.gov/industrial-siting-2/permitting/
        doc_type: guidance
        format: html
        citation_root: W.S. 35-12-101 et seq. (Title 35, Chapter 12)
        notes: "CRITICAL for large gas plants/pipelines. Base statutory threshold was $96,000,000, escalated annually by construction-cost indices. Search results were inconsistent on the CURRENT exact dollar figure (~$231M in one source, and separately $283,166,876 permit trigger / $226,533,500 Certificate-of-Insufficient-Jurisdiction trigger in another, source unclear which year each applies to) - the exact current-year threshold MUST be re-verified directly against the Industrial Siting Council's published annual adjustment before use; do not cite the dollar figures from this record without confirming the effective year."
      - title: Title 35 Chapter 12 - Industrial Development and Siting (2010 statute text, Justia mirror)
        url: https://law.justia.com/codes/wyoming/2010/Title35/chapter12.html
        doc_type: statute
        format: html
        notes: This is a 2010-vintage statute mirror, not necessarily current; use for structure/definitions only, verify against wyoleg.gov for current text.
    permits:
      - name: Industrial Facility Permit (Industrial Siting Permit)
        trigger: Facility estimated construction cost exceeds the current adjusted statutory threshold (base $96M, escalated - reported as roughly $226M-$283M range across sources, unverified exact current figure)
        decision_body: Industrial Siting Council
        public_hearing: true
      - name: Certificate of Insufficient Jurisdiction
        trigger: Facility cost falls in a lower band below the full permit threshold (per one source, ~$226.5M) but the Council determines local jurisdiction is sufficient
        decision_body: Industrial Siting Council
    confidence: unverified
    last_reviewed: "2026-09-04"

  - id: wy-onecall
    jurisdiction_level: state
    state: WY
    name: Wyoming 811 / One-Call of Wyoming
