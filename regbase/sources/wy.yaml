        phone: "307-777-6475"
    confidence: probable
    last_reviewed: "2026-09-04"

  - id: wy-osli
    jurisdiction_level: state
    state: WY
    name: Wyoming Office of State Lands and Investments - State Land ROW / Easements
    agency: Office of State Lands and Investments (OSLI) / Board of Land Commissioners
    authority_type: [surface_owner, roads_row]
    applies_to: [midstream_pipeline, produced_water_line, access_road, electrical_line]
    code_platform: self_hosted
    landing_url: https://lands.wyo.gov/
    documents:
      - title: OSLI Easements (Non-Roadway Easement Application)
        url: https://lands.wyo.gov/trust-land-management/surface-leasing/easements
        doc_type: application_packet
        format: html
        notes: Developer submits Non-Roadway Easement Application; 75% deposit of estimated consideration required; easements typically issued for up to 35-year terms.
      - title: OSLI Applications & Forms
        url: https://lands.wyo.gov/resources/applications-forms
        doc_type: form
        format: html
      - title: OSLI Land and Lease Map Viewer (GIS)
        url: https://lands.wyo.gov/resources/land-and-lease-map-viewer
        doc_type: gis
        format: unknown
    permits:
      - name: Non-Roadway Easement (pipeline/utility ROW across state trust land)
        trigger: Crossing or occupying Wyoming state trust land
        decision_body: OSLI / Board of Land Commissioners
        fee: "75% deposit of estimated consideration required to obtain preliminary approval"
    gis:
      - name: OSLI Land and Lease Map Viewer
        url: https://lands.wyo.gov/resources/land-and-lease-map-viewer
        service_type: unknown
        layer_use: State trust land ownership / leasing
    confidence: probable
    last_reviewed: "2026-09-04"

  - id: wy-wydot-utility
