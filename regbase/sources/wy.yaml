        url: https://deq.wyoming.gov/land-quality/
        doc_type: guidance
        format: html
        notes: Primarily a mining-permitting division (coal/non-coal); relevance to midstream O&G is mainly surface disturbance/reclamation adjacency - not independently confirmed to have a distinct O&G midstream permit this pass.
    confidence: unverified
    last_reviewed: "2026-09-04"

  - id: wy-deq-shwd
    jurisdiction_level: state
    state: WY
    name: Wyoming DEQ Solid & Hazardous Waste Division - Oil & Gas Waste (Reserve Pits)
    agency: Wyoming Department of Environmental Quality, Solid & Hazardous Waste Division (SHWD)
    authority_type: [waste]
    applies_to: [well_pad, tank_battery, swd_well]
