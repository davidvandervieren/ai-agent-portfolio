    name: WYDOT Utility Accommodation / Access Permits (State Highway ROW)
    agency: Wyoming Department of Transportation (WYDOT)
    authority_type: [roads_row]
    applies_to: [midstream_pipeline, produced_water_line, electrical_line, access_road, water_crossing]
    code_platform: self_hosted
