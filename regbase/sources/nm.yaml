  - id: nm-ocd-rules-19-15-nmac
    jurisdiction_level: state
    state: NM
    name: "NM Oil Conservation Division Rules — 19.15 NMAC (Parts 1-41)"
    agency: "Energy, Minerals and Natural Resources Department (EMNRD) — Oil Conservation Division"
    authority_type: [oil_gas_conservation, underground_injection, waste, water_quality, spill_reporting]
    applies_to: [swd_well, well_pad, tank_battery, midstream_pipeline, produced_water_line, gas_processing_plant, compressor_station]
