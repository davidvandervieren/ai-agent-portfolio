    last_reviewed: "2026-09-04"

  - id: nmed-produced-water-act-20-6-8
    jurisdiction_level: state
    state: NM
    name: "Produced Water Act (2019, HB 546) and proposed 20.6.8 NMAC (Water Reuse outside O&G)"
    agency: "New Mexico Environment Department"
    authority_type: [water_quality, waste]
    applies_to: [produced_water_line, swd_well]
    code_platform: state_register
    landing_url: "https://www.env.nm.gov/new-mexico-produced-water/"
    documents:
      - title: "NMED Produced Water Factsheet"
        url: "https://www.env.nm.gov/wp-content/uploads/sites/16/2019/10/Produced-Water-Factsheet_ENGLISH_-FINAL-191010.pdf"
        doc_type: guidance
        format: pdf
      - title: "Public Participation — 20.6.8 NMAC rulemaking"
        url: "https://www.env.nm.gov/new-mexico-produced-water/public-participation-2/"
        doc_type: guidance
        format: html
      - title: "FAQ: Proposed Produced Water Rule 20.6.8 NMAC (Western Environmental Law Center summary — third-party, not NMED)"
        url: "https://westernlaw.org/nmproducedwaterrulefaqs/"
        doc_type: guidance
        format: html
        notes: "Third-party summary of a still-developing rulemaking; treat rule text/status as unverified until confirmed on env.nm.gov or srca.nm.gov."
    notes: "Produced Water Act splits jurisdiction: OCD/19.15.28 NMAC governs produced water reuse/disposal within oil & gas operations; WQCC/NMED 20.6.8 NMAC (still in rulemaking as of last search) governs reuse/discharge outside the industry."
    confidence: probable
    last_reviewed: "2026-09-04"

