  - id: nmed-aqb-gcp-oil-gas
    jurisdiction_level: state
    state: NM
    name: "NMED Air Quality Bureau — General Construction Permit, Oil & Gas (GCP-O&G), 20.2.72 NMAC"
    agency: "New Mexico Environment Department — Air Quality Bureau"
    authority_type: [air_quality]
    applies_to: [compressor_station, gas_processing_plant, tank_battery, well_pad]
    code_platform: state_register
    landing_url: "https://www.env.nm.gov/air-quality/air-quality-oil-and-gas-gcp-application-forms/"
    documents:
      - title: "GCP-Oil and Gas final permit"
        url: "https://www.env.nm.gov/wp-content/uploads/sites/2/2018/06/GCP-Oil-Gas-Final-002.pdf"
        doc_type: permit_record
        format: pdf
        citation_root: "20.2.72.220 NMAC"
      - title: "GCP Application form (7733M2)"
        url: "https://www.env.nm.gov/opf/wp-content/uploads/sites/2/2020/08/AQBP-Application-7733M2.pdf"
        doc_type: application_packet
        format: pdf
      - title: "GCP-O&G registration application"
        url: "https://www.env.nm.gov/air-quality/wp-content/uploads/sites/2/2020/08/AQBP-Application-8883.pdf"
        doc_type: application_packet
        format: pdf
      - title: "AQB Permitting section home"
        url: "https://www.env.nm.gov/air-quality/permitting-section-home-page/"
        doc_type: guidance
        format: html
      - title: "AQB Permit Fees"
        url: "https://www.env.nm.gov/air-quality/permit-fees-2/"
        doc_type: fee_schedule
        format: html
        notes: "GCP-O&G application/modification fee reported as $17,550 per third-party (ALL4) summary — not independently confirmed on env.nm.gov fee table."
    permits:
      - name: "GCP-Oil and Gas registration"
        trigger: "Minor-source O&G production, transmission, or processing facility (compressors, engines, tanks, dehydrators) below Table 106 emission thresholds"
        decision_body: "NMED AQB (ePermitting portal, required since Jan 2023)"
        public_hearing: false
    confidence: verified
    last_reviewed: "2026-09-04"

  - id: nmed-20-2-50-ozone-precursor-rule
    jurisdiction_level: state
    state: NM
    name: "20.2.50 NMAC — Oil and Gas Sector: Ozone Precursor Pollutants"
    agency: "New Mexico Environment Department — Air Quality Bureau"
    authority_type: [air_quality]
    applies_to: [compressor_station, gas_processing_plant, tank_battery, well_pad, midstream_pipeline]
    code_platform: state_register
    landing_url: "https://www.env.nm.gov/air-quality/ozone-draft-rule/"
