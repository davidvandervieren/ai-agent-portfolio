    landing_url: "https://www.emnrd.nm.gov/ocd/occ-info/og-rules-and-forms/"
    documents:
      - title: "19.15.7 NMAC — Application Procedures, Notices and Hearings"
        url: "https://www.srca.nm.gov/parts/title19/19.015.0007.html"
        doc_type: regulation
        format: html
        citation_root: "19.15.7 NMAC"
      - title: "19.15.7 NMAC (PDF)"
        url: "https://www.srca.nm.gov/parts/title19/19.015.0007.pdf"
        doc_type: regulation
        format: pdf
        citation_root: "19.15.7 NMAC"
      - title: "OCD Rules and Forms landing page"
        url: "https://www.emnrd.nm.gov/ocd/occ-info/og-rules-and-forms/"
        doc_type: guidance
        format: html
        notes: "Index of 19.15 NMAC parts by subject; use to reach 19.15.5 (pits/CLS/below-grade tanks), 19.15.9 (well ID/site), 19.15.17 (waste disposal), 19.15.25 (production/measurement), 19.15.26 (SWD/injection), 19.15.27 (surface waste mgmt facilities), 19.15.28 (produced water), 19.15.34."
      - title: "OCD Forms — Oil Conservation"
        url: "https://www.emnrd.nm.gov/ocd/ocd-forms/"
        doc_type: form
        format: html
      - title: "OCD Notices, Requests, Permits and Reports — All OCD Forms"
        url: "https://wwwapps.emnrd.nm.gov/OCD/OCDPermitting/OperatorData/AllOCDForms.aspx"
        doc_type: form
        format: html
    confidence: verified
    last_reviewed: "2026-09-04"

