  - id: nmed-gwqb-discharge-permit-20-6-2
    jurisdiction_level: state
    state: NM
    name: "NMED Ground Water Quality Bureau — Discharge Permits (20.6.2 NMAC)"
    agency: "New Mexico Environment Department — Ground Water Quality Bureau"
    authority_type: [water_quality, waste]
    applies_to: [compressor_station, gas_processing_plant, tank_battery, swd_well]
    code_platform: state_register
    landing_url: "https://www.env.nm.gov/gwqb/permits/"
    documents:
      - title: "Guidance Document for Ground Water Discharge Permit Applications"
        url: "https://www.emnrd.nm.gov/ocd/wp-content/uploads/sites/6/GW-Discharge-Permit-Application-Guidance-Document-September-2022-1.pdf"
        doc_type: guidance
        format: pdf
        citation_root: "20.6.2.3104-3114 NMAC"
      - title: "GWQB DP public notice requirements (archive)"
        url: "https://www-archive.env.nm.gov/gwqb/dp-pn-requirements/"
        doc_type: guidance
        format: html
      - title: "Example discharge permit — Thoreau Compressor Station (Transwestern), DP-1688 draft"
        url: "https://www.env.nm.gov/gwqb/wp-content/uploads/sites/11/2020/12/14-DP-1688-DraftDP-20201112.pdf"
        doc_type: permit_record
        format: pdf
        notes: "Example only, illustrates that compressor stations are permitted under 20.6.2.3104-3114 NMAC (WQCC regs); DP renewal cycle is 5 years."
