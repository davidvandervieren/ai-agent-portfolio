  - id: nm-ocd-c108-injection-disposal
    jurisdiction_level: state
    state: NM
    name: "OCD Form C-108 — Application for Authorization to Inject (SWD/Class II)"
    agency: "EMNRD — Oil Conservation Division"
    authority_type: [underground_injection, oil_gas_conservation, water_quality]
    applies_to: [swd_well]
    code_platform: self_hosted
    landing_url: "https://www.emnrd.nm.gov/ocd/ocd-forms/"
    documents:
      - title: "19.15.26 NMAC — Disposal, Storage & UIC referenced via OCD rules index"
        url: "https://www.emnrd.nm.gov/ocd/occ-info/og-rules-and-forms/"
        doc_type: regulation
        format: html
        citation_root: "19.15.26 NMAC"
        notes: "C-108 filed under 19.15.26.8(B) NMAC. Class II UIC primacy program manual below."
      - title: "OCD Underground Injection Control Program Manual"
        url: "https://www.conservation.ca.gov/calgem/Documents/1.%20New%20Mexico%20-%20UICManual.pdf"
        doc_type: guidance
        format: pdf
        notes: "Mirror copy found via search; verify against emnrd.nm.gov original before citing authoritatively."
    permits:
      - name: "Authorization to Inject (SWD / disposal well)"
        trigger: "New or converted saltwater disposal / injection well"
        form_id: "C-108"
        decision_body: "OCD District/Santa Fe office; hearing if protested"
        public_hearing: true
    confidence: probable
    last_reviewed: "2026-09-04"

  - id: nm-ocd-c137-surface-waste-mgmt-facility
