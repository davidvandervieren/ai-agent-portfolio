        doc_type: regulation
        format: html
        citation_root: "20.2.50 NMAC"
      - title: "Oil and Gas Sector – Ozone Precursor Pollutants — Final Rule (adopted text, effective 2022-08-05)"
        url: "https://www.env.nm.gov/air-quality/wp-content/uploads/sites/2/2022/07/Oil-and-Gas-Sector-Ozone-Precursor-Polutants-Final-rule-20.2.50-NMAC-06Jul22.pdf"
        doc_type: regulation
