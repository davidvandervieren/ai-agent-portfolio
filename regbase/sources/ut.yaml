# Utah regulatory source registry — oil & gas midstream (pipelines, produced water lines,
# SWD/injection wells, compressor stations, gas processing plants)
#
# COVERAGE NOTE: This file was built under a hard WebSearch budget cap that was exhausted
# mid-task (shared session-wide budget, not specific to this file). State-level agencies
# are researched in reasonable depth. County coverage is LIMITED to Uintah, Duchesne,
# Carbon, and Emery (partial) — the remaining counties in scope (Grand, San Juan, Sevier,
# Summit, Daggett, and all others) and ALL municipalities were NOT researched and have
# NO entries here, rather than fabricated ones. See ut.notes.md section (d) for the full
# gap list. Every URL below was actually seen in a WebSearch result snippet; none were
# invented or reconstructed. Confidence levels reflect that content was read from search
# snippets, not fetched pages (WebFetch/curl are blocked in this environment).

sources:
  # ============================== STATE — DOGM / Board of Oil, Gas and Mining ==============================
  - id: ut-dogm-r649-oil-gas-rules
    jurisdiction_level: state
    state: UT
    agency: Utah Division of Oil, Gas and Mining (DOGM) / Board of Oil, Gas and Mining
    name: Utah Oil and Gas Rules (Utah Admin. Code R649)
    authority_type: [oil_gas_conservation, underground_injection, waste, spill_reporting, reclamation]
    applies_to: [midstream_pipeline, produced_water_line, swd_well, compressor_station, gas_processing_plant, well_pad, tank_battery]
