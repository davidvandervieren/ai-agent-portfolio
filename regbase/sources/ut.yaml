  - id: ut-ludma-county-land-use-act
    jurisdiction_level: state
    state: UT
    agency: Utah State Legislature / Office of Property Rights Ombudsman
    name: "Utah Land Use, Development, and Management Act (LUDMA) — Title 17 Ch. 27a (county) / Title 10 Ch. 9a (municipal)"
    authority_type: [land_use_zoning]
    applies_to: [well_pad, compressor_station, gas_processing_plant, midstream_pipeline, tank_battery]
    code_platform: state_register
    landing_url: "https://propertyrights.utah.gov/find-the-law/legal-topics/utah-land-use-development-and-management-act-ludma/"
    documents:
      - title: "Utah's Land Use, Development, and Management Act (LUDMA) — explainer"
        url: "https://propertyrights.utah.gov/find-the-law/legal-topics/utah-land-use-development-and-management-act-ludma/"
        doc_type: guidance
        format: html
        notes: "Statewide framework statute governing county (17-27a) and municipal (10-9a) zoning/land-use authority in Utah; requires general plan, bounds processing timelines (applicant may request 45-day final decision after reasonable time has passed). Search did not surface an explicit statutory oil & gas preemption clause this session — treat any claim of state preemption of local O&G zoning as UNVERIFIED pending direct statute review (see notes.md)."
      - title: "Utah Code Title 17, Chapter 27a — County Land Use, Development, and Management Act, Part 1 Section 101"
        url: "https://le.utah.gov/xcode/Title17/Chapter27A/C17-27a-S101_1800010118000101.pdf"
        doc_type: statute
