        url: "https://oilgas.ogm.utah.gov/pub/Rules/R649_All.pdf"
        doc_type: regulation
        format: pdf
        citation_root: "Utah Admin. Code R649"
        notes: "Compiled R649-1 through R649-11. R649-3 = drilling/operating practices; R649-5 = UIC/Class II injection; R649-6 = gas processing & waste crude treatment; R649-8 = reporting/forms; R649-9 = waste management & disposal (pits, landfarms, commercial disposal); R649-10 = admin procedures; R649-11 = admin penalties."
      - title: "R649-3 Drilling and Operating Practices (third-party mirror, eLaws)"
        url: "http://utrules.elaws.us/uac/r649-3"
        doc_type: regulation
        format: html
        citation_root: "Utah Admin. Code R649-3"
        notes: "Third-party mirror, not the official rules.utah.gov/adminrules.utah.gov text — verify against official source before citing."
      - title: "R649-3-1 Bonding (third-party mirror, eLaws)"
        url: "http://utrules.elaws.us/uac/r649-3-1"
        doc_type: regulation
        format: html
        citation_root: "Utah Admin. Code R649-3-1"
      - title: "Utah DOGM Forms (Form 1 agent designation, Form 3 APD, Form 5 sundry, Form 6, Form 8 injection, Form 9, Form 10, Form 14, etc.)"
        url: "https://ogm.utah.gov/og-forms/"
        doc_type: form
        format: html
      - title: "Electronic Reporting / ePermit registration"
        url: "https://ogm.utah.gov/electronic-reporting/"
        doc_type: guidance
        format: html
        notes: "Companies must register for ePermit before electronically filing APDs, Sundry Notices, or Workover Tax Credit forms."
      - title: "State of Utah Oil and Gas Program — Report Forms (legacy portal)"
        url: "https://oilgasweb.dev.utah.gov/Forms/Forms.htm"
        doc_type: form
        format: html
      - title: "Utah UIC Class II Program Description (DNR)"
        url: "https://ogm.utah.gov/wp-content/uploads/2025/10/UT-Program-Description_Final.docx-1.pdf"
        doc_type: guidance
        format: pdf
        notes: "Describes Utah's UIC Class II primacy program administered by DOGM under R649-5."
    permits:
