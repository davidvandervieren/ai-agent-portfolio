sources:

  # ============================================================
  # PHMSA — Pipeline Safety
  # ============================================================

  - id: phmsa-pipeline-safety-cfr-190-195-199
    jurisdiction_level: federal
    state: US
    name: "PHMSA Federal Pipeline Safety Regulations (49 CFR Parts 190, 191, 192, 195, 199)"
    agency: "Pipeline and Hazardous Materials Safety Administration (PHMSA), U.S. DOT"
    authority_type: [pipeline_safety]
    applies_to: [midstream_pipeline, produced_water_line, compressor_station, gas_processing_plant, metering]
    code_platform: ecfr
    landing_url: "https://www.phmsa.dot.gov/pipeline/annotated-regulations/49-cfr-192"
    documents:
      - title: "49 CFR Part 192 — Transportation of Natural and Other Gas by Pipeline: Minimum Federal Safety Standards"
        url: "https://www.phmsa.dot.gov/pipeline/annotated-regulations/49-cfr-192"
        doc_type: regulation
        format: html
        citation_root: "49 CFR Part 192"
        notes: "Governs gas transmission and gathering pipelines, incl. compressor stations and gas processing interconnects."
      - title: "49 CFR Part 195 — Transportation of Hazardous Liquids by Pipeline"
        url: "https://www.phmsa.dot.gov/pipeline/annotated-regulations/49-cfr-195"
        doc_type: regulation
        format: html
        citation_root: "49 CFR Part 195"
        notes: "Governs crude oil / hazardous liquid gathering and transmission pipelines (relevant to produced-water and NGL lines where jurisdictional)."
      - title: "eCFR 49 CFR Part 191 — Annual, Incident, and Other Reporting for Gas Pipelines"
        url: "https://www.ecfr.gov/current/title-49/subtitle-B/chapter-I/subchapter-D/part-191"
        doc_type: regulation
        format: html
        citation_root: "49 CFR Part 191"
      - title: "eCFR 49 CFR Part 199 — Drug and Alcohol Testing"
        url: "https://www.ecfr.gov/current/title-49/subtitle-B/chapter-I/subchapter-D/part-199"
        doc_type: regulation
        format: html
        citation_root: "49 CFR Part 199"
      - title: "eCFR 49 CFR Part 190 — Pipeline Safety Programs and Rulemaking Procedures (enforcement)"
        url: "https://www.ecfr.gov/current/title-49/subtitle-B/chapter-I/subchapter-D/part-190"
        doc_type: regulation
        format: html
        citation_root: "49 CFR Part 190"
      - title: "PHMSA Operator Qualification (49 CFR 192 Subpart N / 195 Subpart G)"
        url: "https://www.phmsa.dot.gov/pipeline/operator-qualifications/operator-qualification"
        doc_type: guidance
        format: html
        citation_root: "49 CFR 192 Subpart N; 49 CFR 195 Subpart G"
        notes: "OQ rule requires written program documenting covered-task qualification of personnel."
      - title: "Standards Incorporated by Reference (Parts 192/193/195)"
        url: "https://www.phmsa.dot.gov/standards-rulemaking/pipeline/standards-incorporated-reference"
        doc_type: guidance
        format: html
    permits:
      - name: "Operator Qualification (OQ) Program"
        trigger: "Any operator performing covered tasks on a Part 192 or 195 regulated pipeline facility"
        decision_body: "Self-certified by operator; audited by PHMSA / state pipeline safety authority"
        public_hearing: false
      - name: "Construction / design compliance (Part 192 Subpart C/D or Part 195 Subpart C/D)"
        trigger: "New construction, replacement, or uprating of a jurisdictional gas or hazardous liquid pipeline"
        decision_body: "PHMSA (interstate) or state pipeline safety agency operating under PHMSA certification (intrastate)"
        public_hearing: false
    gis:
      - name: "National Pipeline Mapping System (NPMS) Pipelines dataset"
        url: "https://services.arcgis.com/G4S1dGvn7PIgYd6Y/arcgis/rest/services/NPMS_Pipelines_2022/FeatureServer"
        service_type: arcgis_rest
        layer_use: "Public NPMS feature service showing gas transmission and hazardous liquid pipeline centerlines and attributes."
      - name: "NPMS Public Viewer"
        url: "https://pvnpms.phmsa.dot.gov/PublicViewer/"
        service_type: unknown
        layer_use: "County-level pipeline map viewer with operator contact info (requires area selection, not a raw REST endpoint)."
    update_watch:
      check_urls:
        - "https://www.phmsa.dot.gov/pipeline/annotated-regulations/49-cfr-192"
        - "https://www.phmsa.dot.gov/pipeline/annotated-regulations/49-cfr-195"
      cadence: quarterly
      method: search
    confidence: verified
    last_reviewed: "2026-09-04"

  - id: phmsa-integrity-management-hca-mca
    jurisdiction_level: federal
    state: US
    name: "PHMSA Pipeline Integrity Management — High Consequence Areas (HCA) and Moderate Consequence Areas (MCA)"
    agency: "Pipeline and Hazardous Materials Safety Administration (PHMSA), U.S. DOT"
    authority_type: [pipeline_safety]
    applies_to: [midstream_pipeline, compressor_station]
    code_platform: ecfr
    landing_url: "https://www.phmsa.dot.gov/pipeline/gas-distribution-transmission/gas-transmission-integrity-management"
    documents:
      - title: "49 CFR Part 192 Subpart O — Gas Transmission Pipeline Integrity Management"
        url: "https://www.ecfr.gov/current/title-49/subtitle-B/chapter-I/subchapter-D/part-192/subpart-O"
        doc_type: regulation
        format: html
        citation_root: "49 CFR 192 Subpart O"
      - title: "49 CFR Part 195 Subpart F — Hazardous Liquid Pipeline Integrity Management"
        url: "https://www.ecfr.gov/current/title-49/subtitle-B/chapter-I/subchapter-D/part-195/subpart-F"
        doc_type: regulation
        format: html
        citation_root: "49 CFR 195 Subpart F"
      - title: "Federal Register — HCA Identification Methods for Gas Transmission Pipelines"
        url: "https://www.federalregister.gov/documents/2016/12/13/2016-29880/pipeline-safety-high-consequence-area-identification-methods-for-gas-transmission-pipelines"
        doc_type: regulation
        format: html
    permits:
      - name: "Integrity Management Program (baseline assessment plan, periodic reassessment)"
        trigger: "Pipeline segment intersects a High Consequence Area (HCA) or, under the 2019/2022 gas rule amendments, a Moderate Consequence Area (MCA)"
        decision_body: "PHMSA / delegated state pipeline safety agency"
        public_hearing: false
    update_watch:
      cadence: quarterly
      method: search
      check_urls:
        - "https://www.phmsa.dot.gov/pipeline/gas-distribution-transmission/gas-transmission-integrity-management"
    confidence: probable
    last_reviewed: "2026-09-04"

  - id: phmsa-national-registry-opid
    jurisdiction_level: federal
    state: US
    name: "PHMSA National Registry of Pipeline and LNG Operators (Operator ID / OPID)"
    agency: "Pipeline and Hazardous Materials Safety Administration (PHMSA), U.S. DOT"
    authority_type: [pipeline_safety]
    applies_to: [midstream_pipeline, compressor_station, gas_processing_plant]
    code_platform: ecfr
    landing_url: "https://www.ecfr.gov/current/title-49/subtitle-B/chapter-I/subchapter-D/part-191"
    documents:
      - title: "49 CFR 191.22 — National Registry of Pipeline and LNG Operators"
        url: "https://www.law.cornell.edu/cfr/text/49/191.22"
        doc_type: regulation
        format: html
        citation_root: "49 CFR 191.22"
      - title: "PHMSA Form F 1000.2 — Operator Registry Notification Form, Instructions"
        url: "https://www.phmsa.dot.gov/sites/phmsa.dot.gov/files/docs/National_Registry_Notification_Instructions_PHMSA%20F%201000.2_2012%20through%204-2015.pdf"
        doc_type: form
        format: pdf
    permits:
      - name: "Operator Identification Number (OPID) registration"
        trigger: "Any new operator of a gas pipeline, gas pipeline facility, UNGSF, or LNG facility subject to 49 CFR 192/193/195; also required before certain new construction / significant asset changes"
        form_id: "PHMSA F 1000.1 (Operator Assignment Request); PHMSA F 1000.2 (Operator Registry Notification)"
        decision_body: "PHMSA National Registry"
        public_hearing: false
    update_watch:
      cadence: quarterly
      method: search
    confidence: verified
    last_reviewed: "2026-09-04"

  - id: phmsa-incident-reporting
    jurisdiction_level: federal
    state: US
    name: "PHMSA Pipeline Incident and Annual Reporting"
    agency: "Pipeline and Hazardous Materials Safety Administration (PHMSA), U.S. DOT"
    authority_type: [pipeline_safety, spill_reporting]
    applies_to: [midstream_pipeline, produced_water_line, compressor_station, gas_processing_plant]
    code_platform: ecfr
    landing_url: "https://www.phmsa.dot.gov/incident-reporting"
    documents:
      - title: "PHMSA Incident Reporting overview"
        url: "https://www.phmsa.dot.gov/incident-reporting"
        doc_type: guidance
        format: html
      - title: "Gas Transmission, Gathering, and UNGS Incident Report Form F 7100.2"
        url: "https://www.phmsa.dot.gov/forms/gas-transmission-gathering-and-ungs-incident-report-form-f-71002"
        doc_type: form
        format: html
      - title: "Gas Distribution Incident Report Form F 7100.1"
        url: "https://www.phmsa.dot.gov/forms/gas-distribution-incident-report-form-f-7100-1"
        doc_type: form
        format: html
      - title: "eCFR 49 CFR 191.3 / 191.15 — Incident definition and reporting for gas transmission and gathering"
        url: "https://www.ecfr.gov/current/title-49/subtitle-B/chapter-I/subchapter-D/part-191"
        doc_type: regulation
        format: html
    permits:
      - name: "Telephonic + written incident report"
        trigger: "Reportable incident under 49 CFR 191.3 (e.g., death, injury requiring hospitalization, $122,000+ damage (indexed), or unintentional gas release of stated thresholds) on a gas transmission/gathering system"
        form_id: "PHMSA F 7100.2"
        typical_timeline_days: "Telephonic notice ASAP; written report within 30 days of detection"
        decision_body: "PHMSA National Response Center / PHMSA"
        public_hearing: false
      - name: "Distribution system incident report"
        trigger: "Reportable incident on a gas distribution system"
        form_id: "PHMSA F 7100.1"
        decision_body: "PHMSA"
        public_hearing: false
    update_watch:
      cadence: quarterly
      method: search
    confidence: verified
    last_reviewed: "2026-09-04"

  - id: phmsa-gas-gathering-lines-rule
    jurisdiction_level: federal
    state: US
    name: "PHMSA Gas Gathering Line Safety Rule (Type A/B/C/R classification, 2022 amendments)"
    agency: "Pipeline and Hazardous Materials Safety Administration (PHMSA), U.S. DOT"
    authority_type: [pipeline_safety]
    applies_to: [midstream_pipeline, gas_processing_plant]
    code_platform: unknown
    landing_url: "https://www.phmsa.dot.gov/rulemaking-implementation/gas-gathering/gas-gathering-regulatory-overview"
    documents:
      - title: "Gas Gathering Regulatory Overview"
        url: "https://www.phmsa.dot.gov/rulemaking-implementation/gas-gathering/gas-gathering-regulatory-overview"
        doc_type: guidance
        format: html
      - title: "Frequently Asked Questions for Types C and R Gas Gathering"
        url: "https://www.phmsa.dot.gov/sites/phmsa.dot.gov/files/2023-05/TypeC-and-TypeR-Gas-Gathering-FAQs-04-2023.pdf"
        doc_type: guidance
        format: pdf
      - title: "Federal Register — Final rule on gas gathering line reporting and Type C safety standards"
        url: "https://www.govinfo.gov/content/pkg/FR-2021-11-15/pdf/2021-24240.pdf"
        doc_type: regulation
        format: pdf
    permits:
      - name: "Gas gathering line reporting (Types A, B, C, R)"
        trigger: "Owner/operator of any onshore gas gathering line, including previously-unregulated low-pressure/rural gathering lines now classified as Type R (reporting-only) or Type C (regulated onshore gathering, >=8.625in OD and >=20% SMYS or >125 psig)"
        form_id: "PHMSA F 7100.2-1 (annual gas gathering report)"
        decision_body: "PHMSA"
        public_hearing: false
    update_watch:
      cadence: quarterly
      method: search
    confidence: probable
    last_reviewed: "2026-09-04"

  # ============================================================
  # FERC
  # ============================================================

  - id: ferc-nga-section7c-certificate
    jurisdiction_level: federal
    state: US
    name: "FERC Natural Gas Act Section 7(c) Certificate of Public Convenience and Necessity"
    agency: "Federal Energy Regulatory Commission (FERC)"
    authority_type: [pipeline_safety, land_use_zoning]
    applies_to: [midstream_pipeline, compressor_station]
    code_platform: ecfr
    landing_url: "https://www.ferc.gov/industries-data/natural-gas/industry-activities"
    documents:
      - title: "18 CFR Part 157 — Applications for Certificates of Public Convenience and Necessity (NGA Section 7)"
        url: "https://www.ecfr.gov/current/title-18/chapter-I/subchapter-E/part-157"
        doc_type: regulation
        format: html
        citation_root: "18 CFR Part 157"
      - title: "Resource Reports for Applications Filed under the Natural Gas Act at FERC"
        url: "https://www.ferc.gov/resource-reports-at-ferc"
        doc_type: guidance
        format: html
      - title: "FERC Landowner Resources (eminent domain / ROW notice for certificated projects)"
        url: "https://www.ferc.gov/alternative-dispute-resolution/landowner-resources"
        doc_type: guidance
        format: html
      - title: "Certificate of Public Convenience and Necessity for Interstate Natural Gas Pipelines (Permitting Dashboard entry)"
        url: "https://www.permits.performance.gov/node/31941"
        doc_type: guidance
        format: html
    permits:
      - name: "Section 7(c) Certificate of Public Convenience and Necessity"
        trigger: "Construction and operation of new interstate natural gas transmission pipeline facilities, or new interstate gas transportation/sales service, that is NOT covered by an existing blanket certificate and NOT an exempt gathering facility"
        decision_body: "FERC (5 Commissioners)"
        public_hearing: true
        notes: "Applies only where FERC has NGA jurisdiction — i.e., interstate pipeline transportation. Purely intrastate gathering and intrastate transmission are NOT FERC-certificated (state PUC / OGC jurisdiction instead); the jurisdictional line between 'gathering' (exempt) and 'transmission' (jurisdictional) is fact-specific and frequently litigated."
    update_watch:
      cadence: quarterly
      method: search
      check_urls:
        - "https://www.ferc.gov/industries-data/natural-gas/industry-activities"
    confidence: verified
    last_reviewed: "2026-09-04"

  - id: ferc-blanket-certificate-part157
    jurisdiction_level: federal
    state: US
    name: "FERC Blanket Certificate Program (18 CFR Part 157 Subpart F)"
    agency: "Federal Energy Regulatory Commission (FERC)"
    authority_type: [pipeline_safety, land_use_zoning]
    applies_to: [midstream_pipeline, compressor_station]
    code_platform: ecfr
    landing_url: "https://www.ferc.gov/natural-gas/blanket-certificates"
    documents:
      - title: "FERC Blanket Certificates program page"
        url: "https://www.ferc.gov/natural-gas/blanket-certificates"
        doc_type: guidance
        format: html
      - title: "Blanket Certificate Program: Notice to Landowners"
        url: "https://www.ferc.gov/sites/default/files/2020-04/blanketcert.pdf"
        doc_type: guidance
        format: pdf
      - title: "18 CFR 157.201–157.218 (Subpart F — Blanket Certificates), via eCFR Part 157"
        url: "https://www.ecfr.gov/current/title-18/chapter-I/subchapter-E/part-157"
        doc_type: regulation
        format: html
        citation_root: "18 CFR 157.201-157.218"
    permits:
      - name: "Blanket certificate automatic authorization"
        trigger: "Routine construction/replacement/abandonment activity by a pipeline already holding a Part 157 Subpart F blanket certificate, below the automatic-authorization cost threshold"
        decision_body: "Self-implementing, subject to FERC audit"
        public_hearing: false
      - name: "Blanket certificate prior-notice authorization"
        trigger: "Blanket-certificate activity exceeding automatic-authorization thresholds or otherwise requiring 30/60-day prior notice to the public and landowners"
        typical_timeline_days: "30-60 days notice period before construction"
        decision_body: "FERC staff (notice review); Commission if protested"
        public_hearing: false
    update_watch:
      cadence: quarterly
      method: search
    confidence: verified
    last_reviewed: "2026-09-04"

  - id: ferc-form2-3q-financial-reporting
    jurisdiction_level: federal
    state: US
    name: "FERC Form No. 2 / 2-A / 3-Q Natural Gas Pipeline Financial and Operating Reports"
    agency: "Federal Energy Regulatory Commission (FERC)"
    authority_type: [tax_fee]
    applies_to: [midstream_pipeline, compressor_station, gas_processing_plant]
    code_platform: unknown
    landing_url: "https://www.ferc.gov/industries-data/natural-gas/industry-forms"
    documents:
      - title: "Form No. 2 — Major Natural Gas Pipeline Annual Report"
        url: "https://www.ferc.gov/industries-data/natural-gas/resources/industry-forms/form-no-2-major-natural-gas-pipeline-annual"
        doc_type: form
        format: html
      - title: "Form No. 3-Q — Quarterly Financial Report of Electric Utilities, Licensees, and Natural Gas Companies"
        url: "https://www.ferc.gov/industries-data/natural-gas/resources/industry-forms/form-no-3-q-quarterly-financial-report"
        doc_type: form
        format: html
      - title: "Natural Gas Industry Forms landing page"
        url: "https://www.ferc.gov/industries-data/natural-gas/industry-forms"
        doc_type: guidance
        format: html
    permits:
      - name: "FERC Form No. 2 (annual)"
        trigger: "Major interstate natural gas pipeline company (combined gas transported/stored for a fee exceeds 50 million Dth); Form 2-A for non-major companies"
        typical_timeline_days: "Due annually, ~April 18 of the following year"
        decision_body: "FERC Office of Enforcement (filing only, no approval)"
        public_hearing: false
      - name: "FERC Form No. 3-Q (quarterly)"
        trigger: "Same jurisdictional companies as Form 2/2-A, filed quarterly"
        typical_timeline_days: "Majors: within 60 days of quarter end; Non-majors: within 70 days"
        decision_body: "FERC Office of Enforcement"
        public_hearing: false
    update_watch:
      cadence: quarterly
      method: search
    confidence: verified
    last_reviewed: "2026-09-04"

  - id: ferc-ngpa-section311-gathering-exemption
    jurisdiction_level: federal
    state: US
    name: "NGPA Section 311 Intrastate Transportation and the FERC Gathering Exemption"
    agency: "Federal Energy Regulatory Commission (FERC)"
    authority_type: [pipeline_safety]
    applies_to: [midstream_pipeline, produced_water_line]
    code_platform: unknown
    landing_url: "https://www.ferc.gov/industries-data/natural-gas/intrastate-transportation/ngpa-section-311-pipelines"
    documents:
      - title: "NGPA Section 311 Pipelines program page"
        url: "https://www.ferc.gov/industries-data/natural-gas/intrastate-transportation/ngpa-section-311-pipelines"
        doc_type: guidance
        format: html
      - title: "FERC Order No. 735 — Contract Reporting Requirements of Intrastate Natural Gas Companies"
        url: "https://www.ferc.gov/sites/default/files/2020-06/OrderNo.735.pdf"
        doc_type: regulation
        format: pdf
    permits:
      - name: "Statement of Operating Conditions (SOC) for NGPA Section 311 service"
        trigger: "Intrastate pipeline transporting gas 'on behalf of' interstate pipelines/shippers without becoming NGA Section 7 jurisdictional"
        typical_timeline_days: "SOC/rate filing due within 30 days of commencing Section 311 service"
        decision_body: "FERC"
        public_hearing: false
      - name: "Gathering facility determination (jurisdictional 'transmission' vs. exempt 'gathering')"
        trigger: "Any dispute or declaratory-order request over whether a given line is NGA-jurisdictional transmission or non-jurisdictional gathering — determines whether Section 7 certification applies at all"
        decision_body: "FERC (declaratory order) — fact-specific, based on the Farmland Industries / primary function test factors"
        public_hearing: false
        notes: "Critical threshold issue for midstream gathering systems; state oil & gas conservation agencies (not FERC) regulate purely intrastate gathering."
    update_watch:
      cadence: quarterly
      method: search
    confidence: probable
    last_reviewed: "2026-09-04"

  # ============================================================
  # EPA — UIC Class II (SWD / injection) — primacy by state
  # ============================================================

  - id: epa-uic-class2-overview-144-146-147
    jurisdiction_level: federal
    state: US
    name: "EPA Underground Injection Control (UIC) Class II Program — Federal Framework and Primacy Status"
    agency: "U.S. EPA Office of Water"
    authority_type: [underground_injection]
    applies_to: [swd_well, produced_water_line]
    code_platform: ecfr
    landing_url: "https://www.epa.gov/uic/class-ii-oil-and-gas-related-injection-wells"
    documents:
      - title: "Class II Oil and Gas Related Injection Wells (EPA program page)"
        url: "https://www.epa.gov/uic/class-ii-oil-and-gas-related-injection-wells"
        doc_type: guidance
        format: html
      - title: "Underground Injection Control Primacy Status for States, Territories, and Tribes"
        url: "https://www.epa.gov/uic/underground-injection-control-primacy-status-states-territories-and-tribes"
        doc_type: guidance
        format: html
        notes: "EPA's authoritative table of which states hold primacy (and under which SDWA section, 1422 or 1425) for each injection well class."
      - title: "Primary Enforcement Authority for the Underground Injection Control Program"
        url: "https://www.epa.gov/uic/primary-enforcement-authority-underground-injection-control-program"
        doc_type: guidance
        format: html
      - title: "40 CFR Part 144 — UIC Program"
        url: "https://www.ecfr.gov/current/title-40/chapter-I/subchapter-D/part-144"
        doc_type: regulation
        format: html
        citation_root: "40 CFR Part 144"
      - title: "40 CFR Part 146 — UIC Criteria and Standards"
        url: "https://www.ecfr.gov/current/title-40/chapter-I/subchapter-D/part-146"
        doc_type: regulation
        format: html
        citation_root: "40 CFR Part 146"
      - title: "40 CFR Part 147 — State, Tribal, and EPA-Administered UIC Programs"
        url: "https://www.ecfr.gov/current/title-40/chapter-I/subchapter-D/part-147"
        doc_type: regulation
        format: html
        citation_root: "40 CFR Part 147"
      - title: "Underground Injection Control in EPA Region 6 (AR, LA, NM, OK, TX)"
        url: "https://www.epa.gov/uic/underground-injection-control-epa-region-6-ar-la-nm-ok-and-tx"
        doc_type: guidance
        format: html
      - title: "UIC EPA Region 8"
        url: "https://www.epa.gov/uic/uic-epa-region-8"
        doc_type: guidance
        format: html
    permits:
      - name: "Class II UIC permit (state-issued, delegated primacy)"
        trigger: "Any well used to inject fluids associated with oil and gas production (SWD, enhanced recovery, hydrocarbon storage) — i.e., every SWD well in CO/WY/NM/UT/TX"
        decision_body: "State agency (see state-specific records below) under delegated SDWA Section 1425 (or 1422) primacy"
        public_hearing: false
        notes: "FINDING: all five target states (CO, WY, NM, UT, TX) hold Class II primacy — none is EPA-direct-implementation for Class II. EPA Region 6/8 retain oversight, and directly implement Class II only on certain tribal lands (e.g., Navajo Nation Class II program is administered by the Navajo Nation itself under EPA-approved Section 1425 authority, not by the state)."
    update_watch:
      cadence: monthly
      method: search
      check_urls:
        - "https://www.epa.gov/uic/underground-injection-control-primacy-status-states-territories-and-tribes"
    confidence: verified
    last_reviewed: "2026-09-04"

  - id: epa-uic-class2-texas-rrc
    jurisdiction_level: federal
    state: US
    name: "Texas Class II UIC Primacy (Railroad Commission of Texas, SDWA Section 1425)"
    agency: "U.S. EPA Region 6 (oversight); Railroad Commission of Texas (delegated primacy)"
    authority_type: [underground_injection]
    applies_to: [swd_well]
    code_platform: unknown
    landing_url: "https://www.rrc.texas.gov/oil-and-gas/applications-and-permits/injection-storage-permits/oil-and-gas-waste-disposal/"
    documents:
      - title: "RRC Underground Injection Control (UIC) Manual"
        url: "https://www.rrc.texas.gov/media/v3onmigl/uic_manual_uia010_3116.pdf"
        doc_type: guidance
        format: pdf
      - title: "RRC Statewide Rule 9 / Rule 46 (disposal vs. enhanced recovery injection)"
        url: "https://www.rrc.texas.gov/oil-and-gas/applications-and-permits/injection-storage-permits/oil-and-gas-waste-disposal/injection-disposal-permit-procedures/technical-review"
        doc_type: regulation
        format: html
        citation_root: "16 TAC (Statewide Rules 9, 46, 95, 96, 97)"
    permits:
      - name: "Disposal well permit (Statewide Rule 9) / Injection well permit (Statewide Rule 46)"
        trigger: "SWD well (Rule 9, injection into non-productive formation) or enhanced-recovery / hydrocarbon-productive-zone injection (Rule 46)"
        decision_body: "Railroad Commission of Texas"
        public_hearing: false
        notes: "EPA granted TX primacy under SDWA Section 1425 on April 23, 1982."
    update_watch:
      cadence: quarterly
      method: search
    confidence: verified
    last_reviewed: "2026-09-04"

  - id: epa-uic-class2-newmexico-ocd
