    url: https://cdphe.colorado.gov/apcd/oil-and-gas-regulation
    doc_type: guidance
    format: html
  - title: Oil and gas regulation in Colorado (alt URL)
    url: https://cdphe.colorado.gov/oil-and-gas-regulation-in-colorado
    doc_type: guidance
    format: html
  - title: Reducing methane emissions from oil and gas operations
    url: https://cdphe.colorado.gov/apcd/reducing-methane-emissions-from-oil-and-gas-operations
    doc_type: guidance
    format: html
  - title: Oil and gas greenhouse gas intensity program (Regulation Number 22)
    url: https://cdphe.colorado.gov/oil-and-gas-greenhouse-gas-intensity-program
    doc_type: guidance
    format: html
  - title: Greenhouse gas reduction planning for oil and gas midstream fuel combustion equipment
    url: https://cdphe.colorado.gov/midstreamGHGplanning
    doc_type: guidance
    format: html
    notes: Directly relevant to compressor stations / midstream combustion equipment
  - title: Air Pollution Control Division public participation / rulemaking outreach
    url: https://cdphe.colorado.gov/APCD/Outreach
    doc_type: guidance
    format: html
  permits:
  - name: APEN (Air Pollutant Emission Notice)
    trigger: New/modified emitting source under Regulation 3
    decision_body: CDPHE APCD
  - name: Construction/Operating Permit (Regulation 3)
    trigger: Compressor stations, gas processing plants, tank batteries exceeding thresholds
    decision_body: CDPHE APCD
  - name: GP01/GP02 General Permit
    trigger: Qualifying oil & gas sources (engines, tanks) eligible for general permit coverage
