  code_platform: self_hosted
  landing_url: https://ecmc.state.co.us/reg.html
  documents:
  - title: ECMC Regulation landing page (100-1200 series rules)
    url: https://ecmc.state.co.us/reg.html
    doc_type: regulation
    format: html
    citation_root: 2 CCR 404-1
    notes: Index page for all ECMC rule series
  - title: Rules | ECMC (current rules index)
    url: https://ecmc.colorado.gov/regulation/rules
    doc_type: regulation
    format: html
    citation_root: 2 CCR 404-1
  - title: 1100 Series - Flowline Regulations (effective Jan 15, 2021)
    url: https://ecmc.colorado.gov/sites/ecmc/files/documents/1100%20Series%20-%20Flowline%20Regulations_Effective%20January%2015,%202021.pdf
    doc_type: regulation
    format: pdf
    citation_root: 2 CCR 404-1, 1100 Series
    notes: Flowline/produced water & gathering line integrity rules; check for later amended versions
      on the Rules index
  - title: 1200 Series - Protection of Wildlife Resources (effective Dec 15, 2024)
    url: https://ecmc.colorado.gov/sites/ecmc/files/documents/1200%20Series%20-%20Protection%20of%20Wildlife%20Resources_Effective%20December%2015,%202024.pdf
    doc_type: regulation
    format: pdf
    citation_root: 2 CCR 404-1, 1200 Series
  - title: 800 Series - Underground Injection for Disposal and Enhanced Recovery Projects (effective Dec
      15, 2024)
    url: https://ecmc.colorado.gov/sites/ecmc/files/documents/800%20Series%20-%20Underground%20Injection%20for%20Disposal%20and%20Enhanced%20Recovery%20Projects_Effective%20December%2015,%202024.pdf
    doc_type: regulation
    format: pdf
    citation_root: 2 CCR 404-1, 800 Series
  - title: 300 Series - Permitting Process (effective April 30, 2025)
    url: https://ecmc.colorado.gov/sites/ecmc/files/documents/300%20Series%20-%20Permitting%20Process_Effective%20April%2030,%202025.pdf
    doc_type: regulation
    format: pdf
    citation_root: 2 CCR 404-1, 300 Series
  - title: Forms | ECMC
    url: https://ecmc.colorado.gov/forms-and-operator-guidance/forms
    doc_type: form
    format: html
  - title: Understanding ECMC's Forms
    url: https://ecmc.colorado.gov/understanding-ecmcs-forms
    doc_type: guidance
    format: html
  - title: Flowline Integrity / flowlines program
    url: https://ecmc.state.co.us/flowlines/about.html
    doc_type: guidance
    format: html
  - title: Cumulative Impacts program page
    url: https://ecmc.colorado.gov/programs/cumulative-impacts
    doc_type: guidance
    format: html
    notes: DIC / cumulative impacts / alternative location analysis rulemaking (2024-2025); 2000ft setback
      + 'substantial equivalence' framework in DI communities
  - title: Underground Injection Control program page (Class II UIC)
    url: https://ecmc.colorado.gov/programs/underground-injection-control
    doc_type: guidance
    format: html
    notes: Colorado holds SDWA Sec. 1425 primacy for Class II UIC since 1984; ECMC (formerly COGCC) is
      lead agency
  - title: UIC Class II Wells
    url: https://ecmc.colorado.gov/programs/underground-injection-control/uic-class-ii-wells
    doc_type: guidance
    format: html
    notes: Form 31 (Underground Injection Formation Permit Application - Intent) and Form 33 govern SWD/injection
      well permitting
  permits:
  - name: Form 2A Oil and Gas Development Plan (OGDP)
    trigger: New or amended oil & gas location
    form_id: Form 2A
    decision_body: ECMC Director/Commission
    public_hearing: true
  - name: Form 4 Sundry Notice
    trigger: Changes/updates to approved permits, technical/environmental reports
    form_id: Form 4
  - name: Form 31 Underground Injection Formation Permit Application - Intent
    trigger: New Class II injection/SWD well
    form_id: Form 31
    decision_body: ECMC Director
  - name: Form 33 Underground Injection - Subsequent
    trigger: Injection well operational changes/renewal
    form_id: Form 33
  - name: Form 44 Flowline Report
    trigger: Off-location flowlines, produced water transfer systems, crude oil transfer systems, domestic
      taps
    form_id: Form 44
  gis:
  - name: ECMC Flowlines GIS Data
    url: https://ecmc.colorado.gov/data-maps-reports/maps-gis/flowlines-gis-data
    service_type: unknown
    layer_use: Registered flowline/produced water/crude transfer line paths and attributes
  confidence: probable
  last_reviewed: '2026-09-04'
- id: co-cdphe-apcd
  jurisdiction_level: state
  state: CO
  name: CDPHE Air Pollution Control Division - Oil & Gas Regulation
  agency: Colorado Department of Public Health and Environment, Air Pollution Control Division / Air Quality
    Control Commission
  authority_type:
  - air_quality
  applies_to:
  - midstream_pipeline
  - produced_water_line
  - swd_well
  - compressor_station
  - gas_processing_plant
  - tank_battery
  code_platform: self_hosted
  landing_url: https://cdphe.colorado.gov/apcd/oil-and-gas-regulation
  documents:
