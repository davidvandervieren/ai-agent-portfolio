# RegBase — People Layer seed set
#
# STATUS (updated 2026-09-04 refresh pass): A WebSearch-budgeted pass (see
# regbase/people/refresh_log.md for the full accounting) verified or
# probable-sourced 33 of 91 records against live agency pages, official
# press releases, or dated news reporting -- state oil & gas commissions
# and executive directors first, per the task's priority order, then
# county-level seats as search budget allowed. Every added full_name
# carries review_source_urls pointing at the actual page(s) opened; no
# name was typed from memory or inferred from a stale/undated source.
# Records still lacking a confirmable current holder remain
# confidence: unverified with full_name intentionally omitted, exactly as
# collection_playbook.md Step 0 requires -- this is correct behavior, not
# an unfinished task. Some single-seat placeholders (e.g. one generic
# "commissioner" slot standing in for a multi-member body) were split into
# one record per confirmed person; unresolved seats on the same body were
# kept as a companion "-other-seats" placeholder so the total membership
# count stays visible to the next refresh.
#
# What this file provides: the correct structural scaffold of
# jurisdictions, bodies, and titles called out as highest-leverage in the
# task brief, each pre-shaped to regbase/schemas/person.schema.json and
# ready for regbase/people/refresh_task.md to continue via
# collection_playbook.md on the next pass. jurisdiction_id values are
# provisional slugs following the source.schema.json naming convention and
# may need to be reconciled once regbase/sources/ is populated for these
# agencies/counties.
#
# role_type below reflects the PUBLICLY KNOWN STRUCTURE of the office
# itself (e.g. "county commissioners are elected," "agency directors are
# typically appointed/career civil-service") as background institutional
# knowledge, not a verified fact about a specific incumbent -- it should
# still be confirmed against the relevant state statute/agency charter on
# first live refresh, since some structures (e.g. council-manager vs.
# commission county government) vary and have changed in some counties.
#
# Each record uses schema-required fields only, plus `department` and
# `staff_or_decision_maker`/`portfolio` where the office's general function
# is a matter of public record about the OFFICE (not the person). No
# official_contact, term dates, positions, votes, decision_patterns, or
# campaign_finance are populated -- fabricating a plausible-looking URL or
# date is exactly the failure mode this system exists to prevent.

