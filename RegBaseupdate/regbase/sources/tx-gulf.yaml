  - title: Oil & Gas Drilling and Production landing page
    url: https://www.cityofsouthlake.com/905/Oil-Gas-Drilling-and-Production
    doc_type: guidance
    format: html
    notes: States gas permit process requires Article IV, Chapter 9.5 of the City Code plus a Specific
      Use Permit (SUP); 1,000 ft setback per secondary source (Ordinance 880-B, amended 2011-10-18).
