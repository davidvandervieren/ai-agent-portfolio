    url: https://library.municode.com/tx/flower_mound/codes/code_of_ordinances?nodeId=SPBLADERE_APXBFR_ARTIIIGA
    doc_type: ordinance
    format: html
    citation_root: Flower Mound Code of Ordinances, App. B, Art. III
