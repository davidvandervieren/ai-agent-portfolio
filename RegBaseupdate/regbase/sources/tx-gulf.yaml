  - access_road
  code_platform: unknown
  landing_url: https://www.cityofdenton.com/183/Gas-Well-Inspections
  documents:
  - title: Denton Gas Well FAQ
    url: https://www.cityofdenton.com/m/faq?cat=19#question-99
    doc_type: guidance
    format: html
    notes: States gas well ordinance is Denton Municipal Code § 19-2131 and requirements also appear in
      Denton Development Code Subchapter 6; not independently verified against the code library this
      session.
  - title: 'Developers agree to new gas well setbacks (Denton Record-Chronicle)'
    url: https://dentonrc.com/news/developers-agree-to-new-gas-well-setbacks-but-no-more-updates-to-denton-ordinance-for/article_7ca05e1d-46cc-5b8d-bcd6-ac60a5f532ad.html
    doc_type: guidance
    format: html
  - title: 'Denton activists regrouping after fracking ban nullified by HB 40 (Green Source Texas)'
    url: https://www.greensourcetexas.org/articles/denton-activists-regrouping-after-city-s-historic-fracking-ban-nullified-hb-40
    doc_type: guidance
    format: html
    notes: Background on 2014 Denton fracking ban -> HB 40 (2015) nullification -> narrowed surface-only
      ordinance.
  permits:
  - name: Gas Well Permit
    trigger: New gas well or amendment within city limits
    decision_body: Development Services / City Council (for setback variances)
    public_hearing: true
    fee: unverified
  confidence: unverified
  last_reviewed: '2026-09-04'

- id: tx-arlington-gas-drilling
  jurisdiction_level: municipal
  state: TX
  county: Tarrant
  municipality: Arlington
  name: City of Arlington Gas Drilling and Production Chapter (GDPO)
  agency: City of Arlington
  authority_type:
  - land_use_zoning
  - roads_row
  - noise
  applies_to:
  - well_pad
  - access_road
  code_platform: unknown
  landing_url: https://www.arlingtontx.gov/files/assets/city/v/2/city-secretary/documents/city-code-of-ordinances/gas-drilling-and-production-chapter.pdf
  documents:
  - title: Gas Drilling and Production Chapter (full ordinance PDF)
    url: https://www.arlingtontx.gov/files/assets/city/v/2/city-secretary/documents/city-code-of-ordinances/gas-drilling-and-production-chapter.pdf
    doc_type: ordinance
    format: pdf
    citation_root: Arlington Gas Drilling and Production Chapter
    notes: Adopted 2003, amended 2011 to require Council-approved "drilling zones" rather than individual
      well-site permits; 600 ft minimum setback from parks/protected uses (supermajority Council approval
      required inside 600 ft).
  - title: Municipal Drilling Zones - Arlington v. City of Arlington case summary
    url: https://producersedge.law/municipal-drilling-zones-insights-from-arlington-v-city-of-arlington/
    doc_type: guidance
    format: html
  permits:
  - name: Gas Drilling Zone Permit / Specific Use Permit
    trigger: New gas well or drilling zone establishment/expansion
    decision_body: City Council (new/expanded drilling zones); staff-level for wells within an
      already-approved drilling zone
    public_hearing: true
    fee: unverified
  confidence: probable
  last_reviewed: '2026-09-04'

- id: tx-southlake-oil-gas
  jurisdiction_level: municipal
  state: TX
  county: Tarrant
  municipality: Southlake
  name: City of Southlake Oil & Gas Drilling and Production Regulations
  agency: City of Southlake
  authority_type:
