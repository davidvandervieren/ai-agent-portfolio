    url: https://cedarhilltx.com/DocumentCenter/View/1512/Southlake?bidId=
    doc_type: ordinance
    format: pdf
    notes: Third-party-hosted copy of a Southlake ordinance version used by another city as a benchmark;
      verify against Southlake's own current code before relying on specifics.
  - title: City of Southlake Ordinances index
    url: https://www.cityofsouthlake.com/307/Ordinances
    doc_type: ordinance
    format: html
  permits:
  - name: Gas Permit (with prerequisite Specific Use Permit)
    trigger: New gas well drilling
    decision_body: City Council (SUP) then staff (gas permit)
    public_hearing: true
    fee: unverified
  confidence: unverified
  last_reviewed: '2026-09-04'

