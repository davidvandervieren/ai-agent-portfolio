- id: tx-fort-worth-gas-well
  jurisdiction_level: municipal
  state: TX
  county: Tarrant
  municipality: Fort Worth
  name: City of Fort Worth Gas Well Drilling and Production Ordinance
  agency: City of Fort Worth Development Services Department (Gas Wells)
  authority_type:
  - land_use_zoning
  - fire_code
  - noise
  - reclamation
  - roads_row
  - emergency_response
  applies_to:
  - well_pad
  - access_road
  - midstream_pipeline
  code_platform: american_legal
  landing_url: https://www.fortworthtexas.gov/departments/development-services/gaswells
  documents:
  - title: 'Fort Worth Code of Ordinances, Chapter 15: Gas'
    url: https://codelibrary.amlegal.com/codes/ftworth/latest/ftworth_tx/0-0-0-17850
    doc_type: ordinance
    format: html
    citation_root: Fort Worth Code of Ordinances Ch. 15
    notes: Umbrella chapter for gas well drilling and production regulation, recodified post-HB 40 (2015)
      to surface-level "commercially reasonable" scope (setbacks, noise, emergency response, ROW/pipeline
      routing) rather than operational regulation.
  - title: § 15-34 Gas Well Permit Required
    url: https://codelibrary.amlegal.com/codes/ftworth/latest/ftworth_tx/0-0-0-18021
    doc_type: ordinance
    format: html
    citation_root: Fort Worth Code of Ordinances § 15-34
  - title: § 15-36 Gas Well Permitting Procedure
    url: https://codelibrary.amlegal.com/codes/ftworth/latest/ftworth_tx/0-0-0-18116
    doc_type: ordinance
    format: html
    citation_root: Fort Worth Code of Ordinances § 15-36
  - title: § 15-42 Technical Regulations (noise, emergency response plans)
    url: https://codelibrary.amlegal.com/codes/ftworth/latest/ftworth_tx/0-0-0-18268
    doc_type: ordinance
    format: html
    citation_root: Fort Worth Code of Ordinances § 15-42
  - title: § 15-45 Plugged and Abandoned Wells
    url: https://codelibrary.amlegal.com/codes/ftworth/latest/ftworth_tx/0-0-0-18565
    doc_type: ordinance
    format: html
    citation_root: Fort Worth Code of Ordinances § 15-45
  - title: 'Article III: Gas Well Drilling and Production Fees'
    url: https://codelibrary.amlegal.com/codes/ftworth/latest/ftworth_tx/0-0-0-18736
    doc_type: fee_schedule
    format: html
    citation_root: Fort Worth Code of Ordinances Ch. 15, Art. III
  - title: Gas well setback information sheet (PDF)
    url: https://www.fortworthtexas.gov/files/assets/public/v/3/development-services/documents/resources-applications-forms-videos/g/gaswell-setback-information.pdf
    doc_type: guidance
    format: pdf
  permits:
  - name: Gas Well Permit
    trigger: Drill, redrill, deepen, or reopen a gas well within city limits; also covers related surface
      facilities
    decision_body: Development Services Director / Gas Well Review process (City Council for
      variances/waivers)
    public_hearing: true
    fee: See Ch. 15 Art. III Gas Well Drilling and Production Fees schedule (unverified exact amount)
  confidence: probable
  last_reviewed: '2026-09-04'

- id: tx-denton-gas-well
  jurisdiction_level: municipal
  state: TX
  county: Denton
  municipality: Denton
  name: City of Denton Gas Well Ordinance
