    url: https://library.municode.com/tx/flower_mound/codes/code_of_ordinances?nodeId=SPAGEOR_CH34EN_ARTVIIIOIGAPIST
    doc_type: ordinance
    format: html
    citation_root: Flower Mound Code of Ordinances Ch. 34, Art. VIII
    notes: Original ordinance adopted May 2003; amended 2005, 2007, and a substantially rewritten version
      in 2011. 2011 version requires pre/post-drilling water well sampling within 1,500 ft of a gas well;
      penalty up to $2,000/day/violation. Widely used as a template by other North Texas cities.
