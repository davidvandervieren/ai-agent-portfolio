  - tank_battery
  code_platform: self_hosted
  landing_url: https://www.arapahoeco.gov/your_county/county_departments/public_works_and_development/divisions/planning_and_land_development/land_development_code_and_regulations/index.php
  documents:
  - title: Land Development Code and 1041 Regulations (division landing page)
    url: https://www.arapahoeco.gov/your_county/county_departments/public_works_and_development/divisions/planning_and_land_development/land_development_code_and_regulations/index.php
    doc_type: regulation
    format: html
    notes: County's own division page, titled explicitly 'Land Development Code and 1041 Regulations'
      -- this alone settles adoption. Page states the 1041 program is based on 24-65.1-101 et seq. C.R.S.
      and describes the 1041 Permit's purpose (safe/efficient/planned/coordinated growth, adequate community
      services).
  - title: REGULATIONS GOVERNING AREAS AND ACTIVITIES OF STATE INTEREST (Arapahoe County, direct PDF)
    url: https://files.arapahoeco.gov/Public%20Works_Development/planning_land%20development/Regs%20on%20Areas%20Activities%20of%20State%20Interest.pdf
    doc_type: regulation
    format: pdf
    citation_root: Arapahoe County Regulations Governing Areas and Activities of State Interest (24-65.1-101
      et seq., C.R.S.)
    notes: Direct county-hosted PDF of the adopted 1041 regulation text. One search snippet showed a document
      dated December 12, 2006 -- treat that as an early/prior adoption or amendment date, not necessarily
      the current version's date; confirm the effective date on the PDF's own cover page before citing.
  permits:
  - name: 1041 Permit (Areas and Activities of State Interest)
    trigger: A proposed activity or facility falling within a state-interest area/activity category designated
      by Arapahoe County under 24-65.1-101 et seq. C.R.S. (e.g., certain major utility/pipeline facilities,
      depending on the county's specific designations in the PDF above) -- in addition to, not in lieu
      of, standard Land Development Code approvals.
    form_id: unknown
    form_url: https://www.arapahoeco.gov/your_county/county_departments/public_works_and_development/divisions/planning_and_land_development/land_development_code_and_regulations/index.php
    typical_timeline_days: unknown
    decision_body: Arapahoe County Board of County Commissioners (typical for 1041 permits statewide;
      not independently confirmed for Arapahoe specifically)
    public_hearing: true
    fee: unknown
  gis: []
  update_watch:
    check_urls:
    - https://www.arapahoeco.gov/your_county/county_departments/public_works_and_development/divisions/planning_and_land_development/land_development_code_and_regulations/index.php
