- id: co-cdphe-gp-general-permits
  jurisdiction_level: state
  state: CO
  name: CDPHE Air Pollution General Permits GP01/GP02 (oil & gas condensate tank batteries and glycol
    dehydrators)
  agency: CDPHE Air Pollution Control Division
  authority_type:
  - air_quality
  applies_to:
  - tank_battery
  - gas_processing_plant
  - compressor_station
  code_platform: self_hosted
  landing_url: https://cdphe.colorado.gov/apcd/general-air-permits
  documents:
  - title: General air permits (GP01-GP11 index)
    url: https://cdphe.colorado.gov/apcd/general-air-permits
    doc_type: regulation
    format: html
    notes: GP01 = condensate storage tank batteries (confirmed fee $2,490.14 as of a July 2025 update,
      per search snippet). GP02 is understood to be the glycol natural gas dehydrator general permit,
      following APCD's numbering pattern, but this specific mapping was NOT independently confirmed this
      pass -- verify on this index page before citing GP02's exact scope. Effective 2022-09-07, registration
      for GP01/02/05/06/07/08/09/10/11 was realigned with the construction-permitting process; no direct
      GP01/GP02 permit-text PDF URL was located by search (CDPHE's own notice says PDFs are being retired
      in favor of an online submission tool), so only this landing/index page is cited.
    citation_root: 5 CCR 1001-5, Regulation No. 3 (general permits issued thereunder)
  permits:
  - name: GP01 - General Permit for Condensate/Crude Oil Storage Tank Batteries
    trigger: New or modified condensate/crude storage tank battery meeting GP01 emission/equipment criteria
      (in lieu of a case-by-case construction permit)
    form_id: unknown (see landing page; direct form PDF not located)
    form_url: https://cdphe.colorado.gov/apcd/general-air-permits
    typical_timeline_days: unknown
    decision_body: CDPHE Air Pollution Control Division
    public_hearing: false
    fee: $2,490.14 (per a July 2025-dated search snippet -- reconfirm current fee schedule before quoting)
  - name: GP02 - General Permit (glycol dehydrator, per APCD numbering pattern -- unconfirmed)
    trigger: unconfirmed -- likely a glycol natural gas dehydrator meeting GP02 criteria
    form_id: unknown
    form_url: https://cdphe.colorado.gov/apcd/general-air-permits
    typical_timeline_days: unknown
    decision_body: CDPHE Air Pollution Control Division
    public_hearing: false
    fee: unknown
  gis: []
  update_watch:
    check_urls:
    - https://cdphe.colorado.gov/apcd/general-air-permits
    cadence: quarterly
    method: agenda_scan
  confidence: unverified
  last_reviewed: '2026-09-04'
- id: co-cdot-forms-confirmed
  jurisdiction_level: state
  state: CO
  name: CDOT Utility/Special Use and Highway Access Permit forms (confirmed form numbers)
  agency: Colorado Department of Transportation
  authority_type:
  - roads_row
  applies_to:
  - midstream_pipeline
  - produced_water_line
  - access_road
  - electrical_line
  - water_crossing
  code_platform: self_hosted
  landing_url: https://www.codot.gov/business/permits/utilitiesspecialuse
  documents:
  - title: CDOT Form 1233 - Utility/Special Use Permit Application (PDF)
    url: https://www.codot.gov/library/forms/cdot1233.pdf/view
    doc_type: form
    format: pdf
    citation_root: 2 CCR 601-18 (State Highway Utility Accommodation Code)
    notes: CONFIRMED this pass -- CDOT's own forms library. This is the correct utility/special-use permit
      application form (pipeline/utility crossings and longitudinal occupancy of CDOT right-of-way). The
      task brief's 'Form 101' and 'Form 333' could not be corroborated anywhere and do NOT appear to be
      current/correct CDOT numbers -- treat those as wrong, superseded by this finding.
  - title: CDOT Form 0137 - State Highway Access Permit Application
    url: https://www.codot.gov/business/permits/accesspermits/forms/cdot0137
    doc_type: form
    format: pdf
    citation_root: 2 CCR 601-1 (State Highway Access Code)
    notes: CONFIRMED this pass -- this is CDOT's actual access-permit form (driveways/curb cuts/new road
      connections to a state highway), distinct from Form 1233 (utility occupancy/crossing). Also not
      'Form 101' or 'Form 333'.
  - title: 2 CCR 601-18 - Rules and Regulations governing CDOT Utility/Special Use permits (State Highway
      Utility Accommodation Code)
    url: https://www.codot.gov/business/permits/utilitiesspecialuse/assets/2CCR_601_18.pdf
    doc_type: regulation
    format: pdf
    citation_root: 2 CCR 601-18
  permits:
  - name: Utility/Special Use Permit (pipeline or utility crossing/occupancy of CDOT ROW)
    trigger: Any pipeline, produced-water line, or electrical line crossing or running longitudinally
      within CDOT state highway right-of-way
    form_id: CDOT Form 1233
    form_url: https://www.codot.gov/library/forms/cdot1233.pdf/view
    typical_timeline_days: ~14 (about two weeks per CDOT FAQ, region-dependent)
    decision_body: CDOT Regional Utilities Permit Coordinator
    public_hearing: false
    fee: None (no fee for a CDOT utility permit, per CDOT FAQ)
  - name: State Highway Access Permit (new/modified access point to a state highway)
    trigger: Constructing, relocating, closing, or modifying an access point onto a state highway, or
      changing the use of an existing access point (e.g., a compressor station or plant entrance road)
    form_id: CDOT Form 0137
    form_url: https://www.codot.gov/business/permits/accesspermits/forms/cdot0137
    typical_timeline_days: unknown
    decision_body: CDOT (or local government acting as issuing authority under the State Highway Access
      Code)
    public_hearing: false
    fee: unknown
  gis: []
  update_watch:
    check_urls:
    - https://www.codot.gov/business/permits/utilitiesspecialuse
    - https://www.codot.gov/business/permits/accesspermits
    cadence: quarterly
    method: search
  confidence: verified
  last_reviewed: '2026-09-04'
