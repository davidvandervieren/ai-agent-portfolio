  jurisdiction_level: county
  state: CO
  county: Arapahoe
  name: Arapahoe County Regulations Governing Areas and Activities of State Interest (1041 Regulations)
    -- CONFIRMED ADOPTED
  agency: Arapahoe County Public Works and Development, Planning and Land Development Division
  authority_type:
  - land_use_zoning
  applies_to:
  - midstream_pipeline
  - compressor_station
  - gas_processing_plant
