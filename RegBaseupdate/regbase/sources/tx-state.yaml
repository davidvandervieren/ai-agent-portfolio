      - title: "Edwards Aquifer Protection Program landing page"
        url: "https://www.tceq.texas.gov/permitting/eapp"
        doc_type: regulation
        format: html
        citation_root: "30 TAC Ch. 213, Subchapters A & B"
        notes: "HARD TRIGGER: any regulated activity (construction, land clearing, AST/UST installation, pipeline crossing) over the Edwards Aquifer Recharge Zone, Transition Zone, or Contributing Zone requires an approved Water Pollution Abatement Plan (WPAP, recharge/transition zone) or Contributing Zone Plan (CZP) BEFORE any soil disturbance. Regulated-activity list and exclusions at 30 TAC 213.3(28) and 213.22(6). Admin review up to 30 days; technical review of an administratively complete application up to 90 days per 30 TAC 213.4(e). Geographically centered on the Balcones Fault Zone / Central Texas (Kinney-Uvalde-Medina-Bexar-Comal-Hays-Travis-Williamson corridor) — verify against the TCEQ zone GIS map for any specific route, since it can matter for pipelines transiting or originating near the Permian/Eagle Ford edge into Central Texas."
