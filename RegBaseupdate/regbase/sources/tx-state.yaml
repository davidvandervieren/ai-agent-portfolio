        citation_root: "30 TAC Ch. 335, Subchapters C & H"
        notes: "Exempt generators/handlers of industrial/hazardous solid waste must still comply with proper waste management under Subchapters C and H. Oil & gas E&P wastes regulated by RRC (see below) are generally excluded from Ch. 335 while under RRC jurisdiction; midstream facilities (gas plants, compressor stations) generating non-E&P industrial waste (used oil, solvents, etc.) fall under Ch. 335/RG-22."
      - title: "Rules for Hazardous Waste and Nonhazardous Industrial Waste Permits (index)"
        url: "https://www.tceq.texas.gov/permitting/waste_permits/ihw_permits/IHW_Rules.html"
        doc_type: regulation
        format: html
      - title: "TCEQ RG-325 Used Oil Recycling handbook"
        url: "https://www.tceq.texas.gov/downloads/permitting/waste-registration/pub/rg-325.pdf/@@download/file/rg-325.pdf"
        doc_type: guidance
        format: pdf
      - title: "16 TAC 3.30 — Memorandum of Understanding between RRC and TCEQ (effective 7/1/2025)"
        url: "https://www.law.cornell.edu/regulations/texas/16-Tex-Admin-Code-SS-3.30"
        doc_type: regulation
        format: html
        citation_root: "16 TAC §3.30; 30 TAC §7.117 (mirror rule)"
        notes: "THE KEY JURISDICTIONAL-SPLIT RULE. Wastes from oil, gas, and geothermal E&P activities subject to RRC regulation remain under RRC jurisdiction even when processed/treated/disposed of at a TCEQ-authorized Ch. 330 solid waste facility. Under Texas Water Code Ch. 27, TCEQ has UIC jurisdiction over injection wells UNLESS the activity is subject to RRC jurisdiction — RRC holds Class II UIC primacy (SWD/enhanced recovery wells associated with oil & gas, see tx-west/tx-rrc records) while TCEQ retains Class I (hazardous/industrial/municipal waste disposal below USDW), Class III (solution mining), Class V (shallow non-hazardous injection, e.g. some remediation/ASR wells), and Class VI (CO2 geologic sequestration) wells. A produced-water disposal well is RRC Class II; a hazardous-waste deep-well or CO2 sequestration well at the same midstream site is TCEQ Class I/VI — do not assume RRC covers all injection at an oil & gas facility."
    permits:
      - name: "TCEQ Class I UIC permit (hazardous/industrial/municipal waste injection wells)"
        trigger: "Deep-well injection of hazardous, industrial, or municipal waste below the lowermost USDW — NOT applicable to standard produced-water SWD (that is RRC Class II)"
