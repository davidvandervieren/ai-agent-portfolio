  - id: tx-rrc-common-carrier-t4-status
    jurisdiction_level: state
    state: TX
    name: "Common Carrier Pipeline Status (Form T-4 declaration; Natural Resources Code Ch. 111) — Eminent Domain Authority"
    agency: "Railroad Commission of Texas (RRC); enforced/tested through Texas courts"
    authority_type:
      - oil_gas_conservation
      - pipeline_safety
    applies_to:
      - midstream_pipeline
      - produced_water_line
    code_platform: state_register
    landing_url: "https://statutes.capitol.texas.gov/Docs/NR/htm/NR.111.htm"
    documents:
      - title: "Natural Resources Code Chapter 111 — Common Carriers, Public Utilities, and Common Purchasers (statute text)"
        url: "https://statutes.capitol.texas.gov/Docs/NR/htm/NR.111.htm"
        doc_type: statute
        format: html
        citation_root: "Tex. Nat. Res. Code Ch. 111 (esp. §§111.002, 111.003, 111.0013, 111.019, 111.0194)"
        notes: "Pipeline eminent-domain authority in Texas turns on 'common carrier' status: a company owning/operating pipelines transporting crude oil, coal, carbon dioxide, or hydrogen for hire, or transporting crude purchased from others, is a common carrier under §§111.002/111.003/111.0013 and may condemn land/ROW/easements for pipeline construction under §111.019. §111.0194 sets the standard statutory pipeline easement width at 50 feet. A pipeline operator DECLARES common-carrier status on its Form T-4 permit application (see tx-rrc-pipeline-t4-pops in tx-west.yaml) — but per Texas Rice Land Partners v. Denbury Green Pipeline-Texas (Tex. 2012 line of cases), that T-4 declaration is NOT irrefutable/conclusive proof of common-carrier status; it can be challenged and the operator must show a reasonable probability the pipeline will at some point transport gas/oil for third parties (not solely its own production) to sustain eminent-domain authority."
      - title: "Natural Resources Code §111.019 — Right of Eminent Domain"
        url: "https://texas.public.law/statutes/tex._nat._resources_code_section_111.019"
        doc_type: statute
        format: html
      - title: "Natural Resources Code §111.0194 — Pipeline Easements"
        url: "https://texas.public.law/statutes/tex._nat._resources_code_section_111.0194"
        doc_type: statute
        format: html
      - title: "Texas Rice Land Partners Ltd v. Denbury Green Pipeline-Texas LLC (case law)"
        url: "https://caselaw.findlaw.com/court/tx-court-of-appeals/1438464.html"
        doc_type: guidance
        format: html
        notes: "Leading case establishing that T-4 self-declaration of common-carrier status is challengeable in court, not conclusive."
      - title: "Eminent Domain in Texas (Part 3) — Oil and Gas Pipelines (Texas A&M AgriLife legal explainer)"
        url: "https://agrilife.org/texasaglaw/2014/03/31/eminent-domain-in-texas-part-3-oil-and-gas-pipelines/"
        doc_type: guidance
        format: html
    permits:
      - name: "Common-carrier declaration (part of Form T-4 pipeline permit)"
        trigger: "Any pipeline operator seeking eminent-domain/condemnation authority to acquire ROW for a crude oil, produced-water, CO2, or hydrogen pipeline"
        form_id: "Form T-4 (self-declaration checkbox); see tx-west.yaml tx-rrc-pipeline-t4-pops for the base T-4 permit record"
        decision_body: "RRC accepts the T-4 filing administratively; common-carrier status itself is ultimately a judicial question if challenged by a landowner"
        public_hearing: false
    confidence: probable
    last_reviewed: "2026-09-04"

