# regbase/sources/tx-state.yaml
#
# Texas STATE-LEVEL (statewide agency) regulatory records for oil & gas
# midstream projects: TCEQ (air/water/waste/UIC), RRC gaps not already
# covered in tx-west.yaml/tx-east.yaml, THC Antiquities Code, GLO,
# TxDOT, TPWD, Groundwater Conservation Districts, Texas811 / common
# carrier statutes.
#
# Does NOT duplicate tx-west.yaml or tx-east.yaml (owned by other
# agents) — this file is additive, state-level only.
#
# See tx-state.notes.md for HB 40 municipal-preemption summary,
# RRC-vs-TCEQ jurisdictional split, Edwards Aquifer / SWR 36 triggers,
# and the explicit list of items NOT verified this run.

sources:
  - id: tx-tceq-air-pbr-oil-gas
    jurisdiction_level: state
    state: TX
    name: "TCEQ Air Permits by Rule for Oil and Gas Handling and Production Facilities (30 TAC 106.352, 106.359, 106.511, 106.512)"
    agency: "Texas Commission on Environmental Quality (TCEQ)"
    authority_type:
      - air_quality
    applies_to:
      - well_pad
      - tank_battery
      - compressor_station
      - gas_processing_plant
      - metering
      - midstream_pipeline
    code_platform: state_register
    landing_url: "https://www.tceq.texas.gov/permitting/air/permitbyrule/subchapter-o/oil_and_gas.html"
    documents:
      - title: "Air PBR 106.352: Oil and Gas Handling and Production Facilities"
        url: "https://www.tceq.texas.gov/permitting/air/permitbyrule/subchapter-o/oil_and_gas.html"
        doc_type: regulation
        format: html
        citation_root: "30 TAC §106.352"
        notes: "Permits by rule all stationary facilities/groups of facilities at a site handling gases/liquids from production, conditioning, processing, and pipeline transfer of crude oil, natural gas, condensate, produced water, subject to 30 TAC §106.4 general conditions. TCEQ tiered approach: de minimis exclusion -> historical authorization -> PBR -> standard permit -> case-by-case NSR permit."
      - title: "Air PBR 106.359: Planned Maintenance, Startup, and Shutdown (MSS) at Oil and Gas Handling and Production Facilities"
        url: "https://www.tceq.texas.gov/permitting/air/permitbyrule/subchapter-o/mss-oil-gas.html"
        doc_type: regulation
        format: html
        citation_root: "30 TAC §106.359"
      - title: "Air PBR 106.512: Stationary Engines and Turbines"
        url: "https://www.tceq.texas.gov/permitting/air/permitbyrule/subchapter-w/stationary_eng_turb.html"
        doc_type: regulation
        format: html
        citation_root: "30 TAC §106.512"
        notes: "Used to authorize generators/compressor engines remaining at a site >12 months, e.g. diesel/gas-fired generators or compressor engines without grid power. Engines <240 hp need not be registered but must meet fuel/air-quality paragraphs; larger units register via Form PI-7."
      - title: "Air PBR 106.511: Portable and Emergency Engines and Turbines"
        url: "https://www.tceq.texas.gov/permitting/air/permitbyrule/subchapter-w/portable_power.html"
        doc_type: regulation
        format: html
        citation_root: "30 TAC §106.511"
      - title: "MSS Oil & Gas FAQ (PDF)"
        url: "https://www.tceq.texas.gov/downloads/permitting/air/nsr/oil-gas/mss-og-faq.pdf"
        doc_type: guidance
        format: pdf
      - title: "Sour Gas Handling Compliance"
        url: "https://www.tceq.texas.gov/assistance/industry/oil-and-gas/sour-gas-handling-compliance"
        doc_type: guidance
        format: html
        notes: "Standard permit and PBR both have additional H2S-fugitive-emission conditions for sour-gas facilities within 1/4 mile of an off-plant receptor."
      - title: "TCEQ Form 10228 - PI-7 Registration for Permits by Rule (instructions + form, PDF)"
        url: "https://www.tceq.texas.gov/downloads/permitting/air/forms/pbr/10228.pdf/view"
        doc_type: form
        format: pdf
      - title: "TCEQ Form 20182 - PI-7-CERT Registration and Certification for Permits by Rule (Word)"
        url: "https://www.tceq.texas.gov/downloads/permitting/air/forms/pbr/20182.docx/view"
        doc_type: form
        format: doc
      - title: "Numerical Index to Air Permits by Rule"
        url: "https://www.tceq.texas.gov/permitting/air/permitbyrule/pbr-numerical-index"
        doc_type: regulation
        format: html
    permits:
      - name: "PBR 106.352 registration (Oil and Gas Handling and Production Facilities)"
        trigger: "New or modified stationary oil/gas handling, conditioning, processing, or pipeline-transfer facility not eligible for de minimis exclusion or historical exemption"
        form_id: "PI-7 (Form 10228) or PI-7-CERT (Form 20182), submitted via STEERS"
        form_url: "https://www.tceq.texas.gov/downloads/permitting/air/forms/pbr/10228.pdf/view"
        typical_timeline_days: "Registration filed within 10 days after construction begins (self-certifying PBR, not a pre-construction approval); TCEQ review/confirmation timing not verified"
        decision_body: "TCEQ Air Permits Division (registration/self-certification, not a discretionary permit)"
        public_hearing: false
      - name: "PBR 106.359 registration (Maintenance, Startup, Shutdown emissions)"
        trigger: "Planned MSS emission events at an oil & gas handling/production facility"
        form_id: "PI-7 (per facility type), submitted via STEERS"
        decision_body: "TCEQ Air Permits Division"
        public_hearing: false
      - name: "PBR 106.512 registration (stationary engines/turbines >=240 hp)"
        trigger: "Stationary reciprocating engine or gas turbine (e.g. compressor-station drivers, field generators) remaining on site >12 months"
        form_id: "PI-7, Table 29 (reciprocating engines) or Table 31 (gas turbines)"
        typical_timeline_days: "Filed within 10 days after construction begins"
        decision_body: "TCEQ Air Permits Division"
        public_hearing: false
    update_watch:
      check_urls:
        - "https://www.tceq.texas.gov/permitting/air/permitbyrule/subchapter-o/oil_and_gas.html"
        - "https://www.tceq.texas.gov/permitting/air/permitbyrule/pbr-numerical-index"
      cadence: quarterly
      method: agenda_scan
    confidence: probable
    last_reviewed: "2026-09-04"

