- id: tx-midland-county
  jurisdiction_level: county
  state: TX
  county: Midland
  name: Midland County Government
  agency: Midland County Public Works / Road & Bridge / Floodplain Management
  authority_type:
  - floodplain
  - roads_row
  - stormwater
  authority_type_notes: Texas counties have no general zoning authority; Midland County's control over
    oil & gas midstream projects runs through subdivision platting (outside the Midland/Odessa ETJs),
    road & bridge utility/ROW permits, and floodplain development permits.
  applies_to:
  - midstream_pipeline
  - produced_water_line
  - access_road
  - water_crossing
  - compressor_station
  - tank_battery
  code_platform: self_hosted
  landing_url: https://www.co.midland.tx.us/196/Road-Bridge
  documents:
  - title: Public Works | Midland County, TX
    url: https://www.co.midland.tx.us/895/Public-Works
    doc_type: guidance
    format: html
  - title: Floodplain Management | Midland County, TX
    url: https://www.co.midland.tx.us/808/Floodplain-Management
    doc_type: guidance
    format: html
    notes: References Subdivision Regulations for floodplain development permit requirements; Midland
      County Monahans and South Draw Interim Flood Planning Framework adopted 12/13/2021
  - title: Road & Bridge | Midland County, TX
    url: https://www.co.midland.tx.us/196/Road-Bridge
    doc_type: guidance
    format: html
  - title: Midland County Storm Water Management Plan (2025)
    url: https://co.midland.tx.us/DocumentCenter/View/8786/Midland-County---Storm-Water-Management-Plan-2025?bidId=
    doc_type: policy
    format: pdf
  permits:
  - name: Subdivision plat approval
    trigger: Any subdivision requiring county approval by state law (applies outside Midland/Odessa ETJs);
      relevant when a midstream project requires platting or replatting of surface tracts
    decision_body: Midland County Commissioners Court
    public_hearing: true
  - name: Floodplain development permit
    trigger: Development (including pipeline/road/facility construction) within a mapped Special Flood
      Hazard Area
    decision_body: County Floodplain Administrator
  - name: County road/utility line crossing permit (Road & Bridge)
    trigger: Utility or pipeline installation within county road ROW, or oversize/overweight use of county
      roads for construction traffic
    decision_body: Road & Bridge Department
  contacts:
  - role: Road & Bridge Department
    office: Midland County Road & Bridge
    phone: 432-688-4155
  - role: Subdivision Regulations / Planning inquiries
    office: Midland County
    phone: 432-688-4310
  update_watch:
    check_urls:
    - https://www.co.midland.tx.us/196/Road-Bridge
    - https://www.co.midland.tx.us/808/Floodplain-Management
    cadence: quarterly
    method: search
  confidence: probable
  last_reviewed: '2026-09-04'
